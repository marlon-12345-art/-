<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>대신금속 구매관리</title>
<script>
/* ============================================================================
 * claude-shim.js — Claude Artifact 런타임(window.claude) 대체 모듈
 * ----------------------------------------------------------------------------
 * 대신금속 구매관리 앱은 원래 claude.ai Artifact 안에서 아래 기능을 썼습니다.
 *   claude.use('db')        : 공유 문서 DB (collection/doc, onSnapshot 실시간)
 *   claude.use('user')      : 접속자 id·이름·권한
 *   claude.use('downloads') : 파일 저장 (엑셀·PDF)
 *   claude.use('assets')    : 첨부 파일 저장 (사업자등록증·통장사본·명세서 등)
 *   claude.use('sample')    : Claude AI 호출 (사업자등록증·통장 이미지 읽기)
 * 이 파일은 같은 인터페이스를 브라우저 IndexedDB로 흉내 내서, 앱을 일반 웹 브라우저에서
 * 1인용으로 실행할 수 있게 합니다. 여러 사람이 함께 쓰려면 이 파일의 db 부분을
 * 서버(API, Firebase, Supabase 등)로 바꿔 끼우면 됩니다. (README의 「이식 가이드」 참고)
 * ========================================================================== */
(function(){
  const DB_NAME = 'daeshin-purchasing', STORE = 'docs', BLOBS = 'blobs';
  const mem = new Map();            // "collection/id" -> data
  const listeners = new Map();      // collection -> Set(fn)
  let idb = null;

  const openIdb = () => new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => { r.result.createObjectStore(STORE); r.result.createObjectStore(BLOBS); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  const tx = (store, mode, fn) => new Promise((res, rej) => { const t = idb.transaction(store, mode); const s = t.objectStore(store); const out = fn(s); t.oncomplete = () => res(out?.result ?? out); t.onerror = () => rej(t.error); });
  const persist = (key, val) => tx(STORE, 'readwrite', s => val === undefined ? s.delete(key) : s.put(val, key)).catch(e => console.error('저장 실패', e));
  const clone = v => v == null ? v : JSON.parse(JSON.stringify(v));
  const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
  /* update는 중첩 객체를 병합 (Artifact DB와 같은 동작). 배열은 통째로 바꿈 */
  const deepMerge = (a, b) => { const o = isObj(a) ? {...a} : {}; for (const [k, v] of Object.entries(b || {})) o[k] = isObj(v) && isObj(o[k]) ? deepMerge(o[k], v) : clone(v); return o; };
  const newId = () => Math.random().toString(36).slice(2, 12) + Date.now().toString(36).slice(-6);

  const snapshot = c => ({ docs: [...mem].filter(([k]) => k.startsWith(c + '/')).map(([k, v]) => ({ id: k.slice(c.length + 1), data: () => clone(v) })) });
  const notify = c => { const set = listeners.get(c); if (set) for (const fn of set) { try { fn(snapshot(c)); } catch(e){ console.error(e); } } };

  const write = async (c, id, data) => { const key = c + '/' + id; if (data === undefined) mem.delete(key); else mem.set(key, data); notify(c); await persist(key, data); };

  const db = {
    collection(c){
      return {
        onSnapshot(fn, err){ (listeners.get(c) || listeners.set(c, new Set()).get(c)).add(fn); setTimeout(() => fn(snapshot(c)), 0); return () => listeners.get(c)?.delete(fn); },
        async add(data){ const id = newId(); await write(c, id, clone(data)); return { id }; },
        doc(id){
          return {
            async get(){ const v = mem.get(c + '/' + id); return { exists: v !== undefined, id, data: () => clone(v) }; },
            async set(data){ await write(c, id, clone(data)); },
            async update(patch){ const key = c + '/' + id; if (!mem.has(key)){ const e = new Error('not_found'); e.code = 'not_found'; throw e; } await write(c, id, deepMerge(mem.get(key), patch)); },
            async delete(){ await write(c, id, undefined); },
          };
        },
      };
    },
  };

  /* ---- 사용자: 이 브라우저의 로컬 사용자 (이름은 처음 실행 때 입력) ---- */
  const LS = { get(k){ try { return localStorage.getItem(k); } catch(_) { return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch(_) {} } };
  let me = { id: LS.get('shim-uid'), name: LS.get('shim-name') };
  if (!me.id){ me.id = 'u_local_' + newId(); LS.set('shim-uid', me.id); }
  if (!me.name){ me.name = (prompt('사용자 이름을 입력해 주세요 (예: 홍길동)') || '사용자').trim(); LS.set('shim-name', me.name); }
  const user = {
    async id(){ return me.id; },
    async me(){ return { id: me.id, name: me.name, email: null, isOwner: true, canEdit: true }; },
    async can(){ return true; }, async isOwner(){ return true; }, async canEdit(){ return true; },
    async profiles(ids){ return Object.fromEntries([].concat(ids).map(i => [i, { id: i, name: i === me.id ? me.name : '팀원', isMe: i === me.id, guest: false }])); },
  };

  /* ---- 파일 저장 ---- */
  const downloads = {
    async save({ filename, data }){
      const blob = data instanceof Blob ? data : new Blob([data]);
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
      return { status: 'saved' };
    },
  };

  /* ---- 첨부 파일: IndexedDB에 Blob으로 저장, 앱의 /_blob/<id> 링크를 가로채서 열어 줌 ---- */
  const assets = {
    async upload(blob, opts = {}){ const id = newId() + newId(); const b = opts.type ? new Blob([blob], { type: opts.type }) : blob; await tx(BLOBS, 'readwrite', s => s.put(b, id)); return { id, url: '/_blob/' + id, sizeBytes: b.size, contentType: b.type }; },
    async delete(id){ await tx(BLOBS, 'readwrite', s => s.delete(id)); return { deleted: true }; },
    async list(){ return { assets: [], usage: {} }; },
  };
  document.addEventListener('click', async e => {
    const a = e.target.closest?.('a[href^="/_blob/"]'); if (!a) return;
    e.preventDefault();
    const id = a.getAttribute('href').slice(7);
    const b = await new Promise(res => { const t = idb.transaction(BLOBS); const r = t.objectStore(BLOBS).get(id); r.onsuccess = () => res(r.result); r.onerror = () => res(null); });
    if (!b){ alert('파일을 찾지 못했어요. (이 브라우저에 저장된 파일만 열 수 있어요)'); return; }
    window.open(URL.createObjectURL(b), '_blank');
  }, true);

  /* ---- AI(sample): 기본은 사용 안 함 → 사업자등록증 자동 읽기 버튼이 꺼짐.
   *      OpenAI 등으로 바꾸려면 sample.json(prompt, {images}) 이 JSON 객체를 돌려주게 구현 ---- */
  const sample = null;

  /* ---- 시작: IndexedDB 로드 → window.claude 제공 ---- */
  const ready = (async () => {
    idb = await openIdb();
    await new Promise((res, rej) => { const t = idb.transaction(STORE); const s = t.objectStore(STORE); const r = s.openCursor();
      r.onsuccess = () => { const cur = r.result; if (cur){ mem.set(cur.key, cur.value); cur.continue(); } else res(); }; r.onerror = () => rej(r.error); });
  })();
  window.claude = { use: async name => { await ready; return ({ db, user, downloads, assets, sample })[name] ?? null; } };

  /* ---- 데이터 가져오기 / 내보내기 (오른쪽 아래 작은 버튼) ---- */
  async function importJson(file){
    const j = JSON.parse(await file.text()), cols = j.collections || j;
    if (!confirm(`데이터를 가져올까요? 이 브라우저의 기존 데이터는 지워지고 파일 내용으로 바뀌어요.\n(${Object.entries(cols).map(([c, a]) => `${c} ${a.length}`).join(', ')})`)) return;
    await tx(STORE, 'readwrite', s => s.clear()); mem.clear();
    await tx(STORE, 'readwrite', s => { for (const [c, arr] of Object.entries(cols)) for (const d of arr){ const { id, ...rest } = d; const key = c + '/' + id; mem.set(key, rest); s.put(rest, key); } });
    location.reload();
  }
  function exportJson(){
    const cols = {}; for (const [k, v] of mem){ const i = k.indexOf('/'); (cols[k.slice(0, i)] ||= []).push({ id: k.slice(i + 1), ...v }); }
    downloads.save({ filename: `db_export_${new Date().toISOString().slice(0, 10)}.json`, data: JSON.stringify({ app: '대신금속 구매관리', exportedAt: new Date().toISOString(), collections: cols }) });
  }
  window.addEventListener('DOMContentLoaded', () => {
    const box = document.createElement('div');
    box.style.cssText = 'position:fixed;right:10px;bottom:10px;z-index:9999;display:flex;gap:6px;font:12px sans-serif';
    box.innerHTML = '<label style="background:#fff;border:1px solid #bbb;border-radius:6px;padding:4px 8px;cursor:pointer">데이터 가져오기<input type="file" accept=".json" hidden></label><button type="button" style="background:#fff;border:1px solid #bbb;border-radius:6px;padding:4px 8px;cursor:pointer">데이터 내보내기</button>';
    box.querySelector('input').onchange = e => e.target.files[0] && importJson(e.target.files[0]);
    box.querySelector('button').onclick = exportJson;
    document.body.appendChild(box);
  });
})();

</script>
</head>

<style>

  --steel:#0C1013; --steel-ink:#E4E8EC; --steel-muted:#7F8E9A;
  --accent:#DE7A46; --accent-soft:#3A251B; --accent-ink:#1A1310;
  --ok:#5CC08A; --ok-soft:#18301F; --warn:#E0A84A; --warn-soft:#33270F; --bad:#EE7476; --bad-soft:#3A1A1B; --info:#78AEDB; --info-soft:#172836; --form-head:#223241; --grid:#3E4B57; --seal:#F0717A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121619; --surface:#1A2025; --sunk:#151A1E; --ink:#E4E8EC; --muted:#93A0AB; --line:#2C353C;
  --steel:#0C1013; --steel-ink:#E4E8EC; --steel-muted:#7F8E9A;
  --accent:#DE7A46; --accent-soft:#3A251B; --accent-ink:#1A1310;
  --ok:#5CC08A; --ok-soft:#18301F; --warn:#E0A84A; --warn-soft:#33270F; --bad:#EE7476; --bad-soft:#3A1A1B; --info:#78AEDB; --info-soft:#172836; --form-head:#223241; --grid:#3E4B57; --seal:#F0717A;
  color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}

.p-wait{background:var(--warn-soft);color:var(--warn)}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-info{background:var(--info-soft);color:var(--info)}
.p-mute{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.p-acc{background:var(--accent-soft);color:var(--accent)}

.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

<script>

const monthEnd = m => { const [y, mo] = m.split('-').map(Number); return m + '-' + String(new Date(y, mo, 0).getDate()).padStart(2,'0'); };

/* 회사 마감 기준: N월 마감 = (N-1)월 26일 ~ N월 25일 입고분, INGOT은 N월 1일 ~ 말일 입고분 · 마감일은 모두 N월 25일 */

function closeMonthOf(date, it){

}
const mvMonth = x => x.closeMonth || closeMonthOf(x.date, item(x.itemId));
/* 마감관리(매입 집계·대금지불) 파트 보기: 마감관리 탭에서만 적용, SCM·마감 확정은 전체 */
let cpOff = false;
const CPART = () => !cpOff && tab === 'close' && flt.closeSub !== 'plan' && flt.part && flt.part !== '전체' ? flt.part : null;
/* 파트 안에서 공장 하나만 볼 때 (flt.closeFac) */
const CFAC = () => { if (cpOff || tab !== 'close' || flt.closeSub === 'plan' || !flt.closeFac) return null; const av = CPART() ? DONE_FACS[CPART()] : [...DONE_FACS['주조파트'], ...DONE_FACS['가공파트']]; return av.includes(flt.closeFac) ? flt.closeFac : null; };

const cpSuffix = () => CPART() ? '_' + CPART() : '';
function closeRows(m){
  return S.moves.filter(x => x.type === 'in' && x.orderId && x.closed && x.sent && mvMonth(x) === m).map(x => {

  for (const o of S.orders){
    if (o.status === '취소' || !o.orderDate || o.orderDate > end) continue;
    if (CPART() && donePartOf(o) !== CPART()) continue;
    if (CFAC() && doneFacOf(o) !== CFAC()) continue;
    (o.lines||[]).forEach(l => {
      const got = S.moves.filter(x => x.type === 'in' && x.orderId === o.id && x.itemId === l.itemId && x.date <= end).reduce((a,x) => a + n(x.qty), 0);
      const rem = n(l.qty) - got;
      if (rem > 0) out.push({o, l, rem, amt: amt(rem, l.price)});
    });
  }
  return out.sort((a,b) => (a.o.dueDate||'').localeCompare(b.o.dueDate||''));
}

/* 화면을 통째로 갈아끼우지 않고 바뀐 부분만 고친다.
   입력 중인 검색창(한글 조합 포함)이 그대로 유지되도록 하기 위함. */
function morph(a, b, root){
  if (a.nodeType === 1 && !root){
    for (const at of [...a.attributes]) if (!b.hasAttribute(at.name)) a.removeAttribute(at.name);
    for (const at of [...b.attributes]) if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value);
    const tag = a.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA'){
      if (a !== document.activeElement){ if (a.type === 'checkbox' || a.type === 'radio') a.checked = b.checked; else if (a.value !== b.value) a.value = b.value; }
      return;
    }
    if (tag === 'SELECT'){
      if (a !== document.activeElement){ if (a.innerHTML !== b.innerHTML) a.innerHTML = b.innerHTML; a.value = b.value; }
      return;
    }
  }
  const ac = [...a.childNodes], bc = [...b.childNodes];
  for (let i = 0; i < bc.length; i++){
    const x = ac[i], y = bc[i];
    if (!x){ a.appendChild(y); continue; }
    if (x.nodeType !== y.nodeType || x.nodeName !== y.nodeName || (x.nodeType === 1 && x.id !== y.id)){ a.replaceChild(y, x); continue; }
    if (x.nodeType !== 1){ if (x.nodeValue !== y.nodeValue) x.nodeValue = y.nodeValue; continue; }
    morph(x, y);
  }
  for (let i = bc.length; i < ac.length; i++) ac[i].remove();
}

  /* 마감: 입고 완료된 품목을 체크해서 마감 → 마감관리 데이터로 */
  const m = flt.doneMonth ||= closeMonthOf(today()), st = flt.doneSt ||= '전체', part = flt.donePart ||= '주조파트', fac = flt.doneFac ||= '전체', q = (flt.q.done || '').toLowerCase();

  const scnt = s2 => every.filter(x => inPart(x) && stOk(x, s2)).length;
  const sendCnt = new Set(every.filter(x => inPart(x) && x.anyClosed && x.cm === m && !x.sent).map(x => x.o.supplierId)).size;
  const rows = every.filter(inPart).filter(x => st === '전체' ? (x.closed ? x.cm === m : x.pm <= m) : st === '마감완료' ? x.closed && x.cm === m : !x.closed && x.pm <= m)
    .filter(x => fac === '전체' || doneFacOf(x.o) === fac)

    .sort((a, b) => (a.lastDate || '').localeCompare(b.lastDate || '') || (a.o.poNo || '').localeCompare(b.o.poNo || '') || a.i - b.i);
  const sel = flt.dsel ||= new Set(); const keys = new Set(rows.map(x => x.key)); for (const k of [...sel]) if (!keys.has(k.split('|')[0])) sel.delete(k);
  const selMv = doneTargets([...sel], rows);
  /* 마감된 것과 미마감인 것은 함께 고를 수 없게: 처음 고른 쪽 기준으로 반대쪽 체크박스를 잠금 */
  const selMode = !sel.size ? null : selMv.every(mv => mv.closed) ? 'closed' : selMv.every(mv => !mv.closed) ? 'open' : 'mix';
  const lockT = st => st === 'closed' ? '미마감 항목을 고른 상태라 마감된 항목은 함께 고를 수 없어요.' : '마감된 항목을 고른 상태라 미마감 항목은 함께 고를 수 없어요.';
  const cbx = (key, st, label) => { const on = sel.has(key), lock = !on && selMode && selMode !== st; return `<input type="checkbox" data-dsel="${esc(key)}" data-dst="${st}" ${on ? 'checked' : ''} ${lock ? `disabled title="${lockT(st)}"` : ''} aria-label="${label}">`; };
  const nOpen = selMv.filter(mv => !mv.closed).length ? [...sel].length : 0, nDone = selMv.filter(mv => mv.closed).length ? [...sel].length : 0;
  const can = x => !x.closed || !confirmed;
  const allOn = rows.some(can) && rows.filter(can).every(x => sel.has(x.key));
  const tot = rows.reduce((a, x) => a + x.ramt, 0);
  const [y, mo] = m.split('-');
  const doneCommon = x => `<td class="mono nw">${esc(yy(x.lastDate))}</td><td class="nw"><button class="lnk mono" data-act="orderDetail" data-id="${x.o.id}">${esc(x.o.poNo || '')}</button></td><td class="nw">${esc(orderSup(x.o))}</td><td class="nw">${esc(x.o.factory || '')}</td><td class="nw">${esc(x.line || '')}</td><td class="nw">${esc(x.it.account || '')}</td><td class="nw">${esc(x.it.subAccount || '')}</td><td class="mono nw">${esc(x.it.code || '')}</td><td>${esc(x.it.name || '')}</td><td class="dim">${esc(x.it.spec || '')}</td><td class="num">${fmt(x.l.qty)}</td>`;
  const tr = rows.map((x, i) => `<tr class="${sel.has(x.key) ? 'cur' : ''}"><td class="c">${can(x) ? cbx(x.key, x.closed ? 'closed' : x.anyClosed ? 'mix' : 'open', '선택') : '<input type="checkbox" checked disabled title="마감 확정된 월이라 마감을 취소할 수 없어요" aria-label="마감 확정">'}</td><td class="c dim nowrap">${i + 1}</td><td>${x.closed ? `<span class="pill p-ok">마감</span>${x.sent ? ' <span class="pill p-info">전송</span>' : ''} <span class="dim mono" style="font-size:11px">${esc(yy(x.cd))}</span>` : x.partClosed ? '<span class="pill p-info">일부 마감</span>' : `<span class="pill p-wait">미마감</span>${x.pm < m ? ` <span class="low" style="font-size:11px">${+x.pm.slice(5)}월분</span>` : ''}`}${isOuts(x.it) && !x.anyClosed ? ` <button class="lnk" style="font-size:11.5px" data-act="doneDefEdit" data-k="${x.key}">검수 수정</button>` : ''}</td>${doneCommon(x)}<td class="nw">${defParts(x.moves, x.l.price).length ? '<span class="dim" style="font-size:12px">합계</span>' : ''}</td><td class="num">${fmt(x.rc)}</td><td>${esc(x.it.unit || '')}</td><td class="num">${defParts(x.moves, x.l.price).length ? '<span class="dim">–</span>' : fmt(prc(x.l.price))}</td><td class="num">${fmt(x.ramt)}</td></tr>` + defParts(x.moves, x.l.price).map((d, j) => { const pk = x.key + '|' + d.key; return `<tr class="def-sub ${sel.has(x.key) || sel.has(pk) ? 'cur' : ''}"><td class="c">${!d.closed || !confirmed ? cbx(pk, d.closed ? 'closed' : 'open', d.kind + ' 선택') : '<input type="checkbox" checked disabled title="마감 확정된 월이라 마감을 취소할 수 없어요" aria-label="마감 확정">'}</td><td class="c dim nowrap" style="font-size:11.5px">${i + 1}-${j + 1}</td><td>${d.closed ? `<span class="pill p-ok">마감</span>${d.sent ? ' <span class="pill p-info">전송</span>' : ''}` : '<span class="pill p-wait">미마감</span>'}</td>${doneCommon(x)}<td class="nowrap">${defKindPill(d.kind, d.rate)}</td><td class="num">${fmt(d.qty)}</td><td>${esc(x.it.unit || '')}</td><td class="num">${fmt(prc(d.price))}</td><td class="num">${fmt(d.amt)}</td></tr>`; }).join('')).join('');
  const topHtml = head(`${y}년 ${+mo}월 마감`, `${+mo}월 마감 = ${(() => { const [a, b] = closePeriod(m); return `${+a.slice(5, 7)}/${+a.slice(8)} ~ ${+b.slice(5, 7)}/${+b.slice(8)}`; })()} 입고분 (INGOT은 ${+mo}/1 ~ ${+mo}/${+end.slice(8)}) · 마감일 ${+mo}/25 · 마감 후 「집계 전송」해야 마감관리에 반영돼요 · ${confirmed ? '<span class="pill p-ok">마감 확정</span>' : '<span class="pill p-wait">마감 진행중</span>'}`, `${searchBox('done', '발주번호·거래처·품목')}<input type="month" id="done-month" value="${m}" aria-label="마감 월" style="width:auto"><button class="btn" data-act="doneXls">엑셀</button>`) +
    `<div class="seg-stack"><div class="seg" role="tablist">${['전체', '주조파트', '가공파트'].map(p => `<button role="tab" aria-selected="${part === p}" data-act="donePart" data-k="${p}">${p}${pcnt(p) ? ` <span class="cnt">${pcnt(p)}</span>` : ''}</button>`).join('')}</div>

  }).join('')}</tbody></table></div>${rows.length > 200 && !flt.stMore ? `<div style="padding:12px;text-align:center"><button class="btn" data-act="stMore">나머지 ${fmt(rows.length-200)}개 더 보기</button></div>` : ''}` : S.items.length ? `<div class="empty"><b>${q ? '검색 결과가 없어요' : '재고를 관리 중인 품목이 없어요'}</b>${q ? '' : `등록 품목 ${fmt(S.items.length)}개 중 입출고·안전재고·입고예정이 있는 품목만 보여요. 품목을 검색하면 모두 찾을 수 있어요.`}</div>` : `<div class="empty"><b>등록된 품목이 없어요</b>품목·단가 탭에서 품목을 먼저 등록해 주세요.<br><button class="btn pri" data-act="newItem">품목 등록</button></div>`)}</div>

  ${mv.length ? `<div class="tbl"><table><thead><tr><th>일자</th><th>구분</th><th>품목</th><th class="num">수량</th><th>참조</th><th>비고</th><th>처리자</th><th></th></tr></thead><tbody>${mv.map(m => `<tr><td class="mono">${esc(m.date)}</td><td><span class="pill ${TY[m.type]?.[1]}">${TY[m.type]?.[0]||m.type}</span></td><td>${esc(itemLabel(m.itemId))}</td><td class="num">${m.type==='out'?'−':(m.type==='adj'&&n(m.qty)>0?'+':'')}${fmt(Math.abs(n(m.qty)) * (m.type==='adj'&&n(m.qty)<0?-1:1))}</td><td>${ref(m)}</td><td class="dim">${esc(m.note||'')}</td><td>${who(m.createdBy)}</td><td><div class="act"><button class="btn ghost sm danger" data-act="delMove" data-id="${m.id}" aria-label="삭제">삭제</button></div></td></tr>`).join('')}</tbody></table></div>` : `<div class="empty">아직 출고·조정 기록이 없어요.</div>`}</div>`;
},

  }).join('')}</tbody></table></div>${rows.length > 200 && !flt.itMore ? `<div style="padding:12px;text-align:center"><span class="dim" style="margin-right:8px">${fmt(rows.length)}개 중 200개 표시 · 검색이나 대분류로 좁혀 보세요</span><button class="btn" data-act="itMore">전체 보기</button></div>` : ''}` : `<div class="empty"><b>${q?'검색 결과가 없어요':'등록된 품목이 없어요'}</b>원자재, 부자재, 소모품 등 구매하는 품목을 등록해 주세요.<br><button class="btn pri" data-act="newItem">품목 등록</button></div>`)}</div>`;

suppliers(){

    ${['사용함','사용안함'].map(k => `<button class="chip" data-act="supFlt" data-key="suse" data-v="${k}" aria-pressed="${use===k}">${k} ${ucnt(k)}</button>`).join('')}

  }).join('')}</tbody></table></div>${rows.length > shown.length ? `<div style="padding:12px;text-align:center"><button class="btn" data-act="supMore">나머지 ${rows.length - shown.length}곳 더 보기</button></div>` : ''}` : `<div class="empty"><b>${q?'검색 결과가 없어요':'등록된 거래처가 없어요'}</b>자주 거래하는 공급업체부터 등록해 보세요.<br><button class="btn pri" data-act="newSupplier">거래처 등록</button></div>`)}</div>`;
},

  const rows = base.filter(c => st === '전체' || ctStatus(c) === st).filter(c => match(q, c.no, supName(c.supplierId), c.docType, c.title, c.content, c.manager, c.note)).sort((a, b) => (b.contractDate || '').localeCompare(a.contractDate || '') || (b.createdAt || '').localeCompare(a.createdAt || ''));

  }).join('')}</tbody></table></div>` : `<div class="empty"><b>${q || st !== '전체' ? '조건에 맞는 계약서가 없어요' : '등록된 계약서가 없어요'}</b>${gen ? '구매계약' : '기본거래계약서·NDA'}를 등록하고 계약서 파일을 첨부해 두세요.<br><button class="btn pri" data-act="ctNew">+ 계약서 등록</button></div>`;
  return head('계약서 관리', `만료 ${CT_SOON}일 전부터 「만료임박」으로 표시돼요. 자동연장 계약은 종료일이 지나도 정한 단위(1·2·3년)만큼 연장된 것으로 봐요.`, `${searchBox('ct', '계약번호·거래처·계약명·담당자')}<button class="btn pri" data-act="ctNew">+ 계약서 등록</button>`) +
  `<div class="seg" role="tablist">${CT_SUBS.map(([k, l]) => `<button role="tab" aria-selected="${sub === k}" data-act="ctSub" data-k="${k}">${l} <span class="dim">${S.contracts.filter(c => (c.kind || '외주') === k).length}</span></button>`).join('')}</div>
  <div class="bar"><div class="chips">${['전체', '유효', '만료임박', '만료', '해지'].map(k => `<button class="chip" data-act="flt" data-key="ctSt" data-v="${k}" aria-pressed="${st === k}">${k} ${k === '전체' ? base.length : base.filter(c => ctStatus(c) === k).length}</button>`).join('')}</div></div>

close(){
  const m = flt.month ||= today().slice(0,7);
  const sub = flt.closeSub ||= 'sum';
  const [y, mo] = m.split('-');
  const cl = closingOf(m) || {}, closed = cl.status === '확정';
  const status = closed ? `<span class="pill p-ok">마감 확정</span> ${who(cl.confirmedBy)} · <span class="mono">${esc((cl.confirmedAt||'').slice(0,10))}</span>` : `<span class="pill p-wait">마감 진행중</span>`;
  const SUBS = [['sum','매입 집계'],['pay','대금지불'],['plan','구매 계획/실적']];
  return head(`${y}년 ${+mo}월 마감`, status, `<input type="month" id="close-month" value="${m}" aria-label="마감 월" style="width:auto">`) +
    `<div class="seg-stack"><div class="seg" role="tablist">${SUBS.map(([k,l]) => `<button role="tab" aria-selected="${sub===k}" data-act="closeSub" data-k="${k}">${l}</button>`).join('')}</div>${sub === 'plan' ? '' : partSeg() + `<div class="seg" role="tablist">${['전체', ...(CPART() ? DONE_FACS[CPART()] : [...DONE_FACS['주조파트'], ...DONE_FACS['가공파트']])].map(f => `<button role="tab" aria-selected="${(CFAC() || '전체') === f}" data-act="closeFac" data-k="${f}">${f}</button>`).join('')}</div>`}</div>` +
    (CPART() || CFAC() ? `<p class="dim" style="margin:-6px 0 12px;font-size:12px"><b>${esc(CFAC() || CPART())}</b> 공장(${esc(FACTORIES.filter(cpFacOk).join(', '))}) 입고분만 보여요. 지급 기록은 거래처 단위라 다른 파트 금액과 함께 계산될 수 있어요. 마감 확정은 전체 기준이에요.</p>` : '') +
    VIEWS[{sum:'closeSum', pay:'closePay', plan:'closePlan'}[sub]](m);
},

closeSum(m){
  const [y, mo] = m.split('-');
  const cl = closingOf(m) || {}, closed = cl.status === '확정';

        termText: col.term >= 0 ? String(row[col.term] ?? '').trim() : '', note: col.note >= 0 ? String(row[col.note] ?? '').trim() : '', order: rows.length});
    }
    const seen = {}, dup = new Set();
    for (const x of rows){ if (seen[x.key]){ dup.add(x.name); x.key = x.key + '_' + (++seen[x.key]); } else seen[x.key] = 1; }
    if (decs.size) warn.push(`원 미만 소수점이 있는 금액을 반올림했어요: ${[...decs].join(', ')}.`);
    if (dup.size) warn.push(`같은 매입처가 여러 줄 있어요: ${[...dup].join(', ')}. 줄마다 따로 지급 관리돼요.`);
    return {sheet: sn, month, rows, warn};
  }
  return null;
}

/* 구매 계획/실적 */
function planActual(m){
  const plan = S.plans.find(p => p.id === m)?.items || {};
  const act = new Map();
  for (const r of closeRows(m)){ const a = act.get(r.itemId) || {qty:0, amt:0}; a.qty += r.qty; a.amt += r.amt; act.set(r.itemId, a); }
  const ids = [...new Set([...Object.keys(plan), ...act.keys()])];
  return ids.map(id => {
    const p = plan[id] || {}, a = act.get(id) || {qty:0, amt:0};
    return {itemId:id, cat: item(id)?.category || '미분류', pQty:n(p.qty), pAmt:amt(p.qty, p.price), aQty:a.qty, aAmt:a.amt};
  }).filter(r => r.pQty || r.aQty).sort((a,b) => a.cat.localeCompare(b.cat) || itemLabel(a.itemId).localeCompare(itemLabel(b.itemId)));
}
function yearPlanActual(y){
  return Array.from({length:12}, (_,i) => {
    const m = `${y}-${String(i+1).padStart(2,'0')}`;
    const r = planActual(m);
    return {m, p: r.reduce((a,x) => a + x.pAmt, 0), a: r.reduce((a,x) => a + x.aAmt, 0)};
  });
}

  };

async function payDocSheet(m){
  const [y, mo] = m.split('-');
  const {list, tot} = payDocData(m);
  const titles = approvalTitles(), ap = closingOf(m)?.payApprovals || {};
  const names = {};
  const ids = Object.values(ap).filter(a => a?.by).map(a => a.by);
  if (user && ids.length){ try { const ps = await user.profiles(ids); for (const k in ps) names[k] = ps[k].name || ''; } catch(_) {} }
  const NC = 4 + (FACTORIES.length + 1) * 2 + 3, cT = 4 + (FACTORIES.length + 1) * 2;
  const bd = {style:'thin', color:{rgb:'000000'}}, B = {top:bd, bottom:bd, left:bd, right:bd};
  const F = (o = {}) => ({name:'맑은 고딕', sz:9, ...o});
  const ST = {
    title:{font:F({sz:20, bold:true}), alignment:{horizontal:'center', vertical:'center'}},
    signL:{font:F({sz:12, bold:true}), alignment:{horizontal:'center', vertical:'center', wrapText:true}, border:B},
    signH:{font:F({sz:11, bold:true}), alignment:{horizontal:'center', vertical:'center'}, border:B},
    signB:{font:F({sz:10, bold:true, color:{rgb:'C00000'}}), alignment:{horizontal:'center', vertical:'center', wrapText:true}, border:B},
    unit:{font:F(), alignment:{horizontal:'right'}},
    head:{font:F({bold:true}), fill:{patternType:'solid', fgColor:{rgb:'DCE6F1'}}, alignment:{horizontal:'center', vertical:'center', wrapText:true}, border:B},
    cell:{font:F(), alignment:{vertical:'center'}, border:B},
    cellC:{font:F(), alignment:{horizontal:'center', vertical:'center'}, border:B},
    num:{font:F(), alignment:{horizontal:'right', vertical:'center'}, border:B, numFmt:'#,##0'},
    numB:{font:F({bold:true}), alignment:{horizontal:'right', vertical:'center'}, border:B, numFmt:'#,##0'},
    tot:{font:F({bold:true}), fill:{patternType:'solid', fgColor:{rgb:'DCE6F1'}}, alignment:{horizontal:'right', vertical:'center'}, border:B, numFmt:'#,##0'},
    totL:{font:F({bold:true}), fill:{patternType:'solid', fgColor:{rgb:'DCE6F1'}}, alignment:{horizontal:'center', vertical:'center'}, border:B},
  };
  const cells = {}, merges = [];
  const set = (r, c, v, st) => { cells[r + ',' + c] = {v, st}; };
  const merge = (r1, c1, r2, c2, st) => { merges.push({s:{r:r1, c:c1}, e:{r:r2, c:c2}}); for (let r = r1; r <= r2; r++) for (let c = c1; c <= c2; c++) if (!cells[r+','+c]) set(r, c, null, st); };
  set(0, 0, `${y}년 ${+mo}월 대신금속 대금지불품의`, 'title'); merge(0, 0, 0, NC-1, 'title');
  const sc = NC - titles.length - 1;
  set(2, sc, '결\n\n재', 'signL'); merge(2, sc, 4, sc, 'signL');
  titles.forEach((t, i) => {
    set(2, sc+1+i, t, 'signH');
    const a = ap[i];
    set(3, sc+1+i, a ? `${names[a.by] || '결재'}\n${(a.at||'').slice(5,10).replace('-','/')}` : null, 'signB');
    merge(3, sc+1+i, 4, sc+1+i, 'signB');
  });
  set(5, NC-1, '(단위: 원)', 'unit');
  const H = 6;
  [['NO',0],['대분류',1],['중분류',2],['매입처',3]].forEach(([t,c]) => { set(H, c, t, 'head'); merge(H, c, H+1, c, 'head'); });
  [...FACTORIES, '총합계'].forEach((f, k) => { const c = 4 + k*2; set(H, c, f, 'head'); merge(H, c, H, c+1, 'head'); set(H+1, c, '공급가액', 'head'); set(H+1, c+1, '부가세', 'head'); });
  ['총합계','결제조건','비고'].forEach((t, k) => { const c = cT + k; set(H, c, t, 'head'); merge(H, c, H+1, c, 'head'); });
  list.forEach((g, i) => {
    const r = H + 2 + i;
    set(r, 0, i+1, 'cellC'); set(r, 1, g.group, 'cellC'); set(r, 2, g.sub || null, 'cellC'); set(r, 3, g.name, 'cell');
    FACTORIES.forEach((f, k) => { const s = g.fac[f] || 0; set(r, 4+k*2, s || null, 'num'); set(r, 5+k*2, g.facVat[f] || null, 'num'); });
    set(r, cT-2, g.supply, 'num'); set(r, cT-1, g.vat, 'num'); set(r, cT, g.total, 'numB'); set(r, cT+1, g.termText, 'cellC'); set(r, cT+2, g.note || null, 'cell');
  });
  const tr = H + 2 + list.length;
  set(tr, 0, '합 계', 'totL'); merge(tr, 0, tr, 3, 'totL');
  FACTORIES.forEach((f, k) => { set(tr, 4+k*2, tot.fac[f] || null, 'tot'); set(tr, 5+k*2, tot.facVat[f] || null, 'tot'); });
  set(tr, cT-2, tot.supply, 'tot'); set(tr, cT-1, tot.vat, 'tot'); set(tr, cT, tot.total, 'tot'); set(tr, cT+1, null, 'tot'); set(tr, cT+2, null, 'tot');
  const ws = {};
  for (const [k, {v, st}] of Object.entries(cells)){

    <label class="f" for="rq-note">특기사항<textarea id="rq-note" ${dis}>${esc(r?.note || '')}</textarea></label>
    <div class="rq-g3">${[0,1,2].map(i => `<label class="f" for="rq-f${i}">첨부파일_${i + 1}${files[i] ? `<span class="rq-file"><a href="/_blob/${esc(files[i].id)}" target="_blank" rel="noopener">${esc(files[i].name)}</a></span>` : ''}${ro ? '' : `<input type="file" id="rq-f${i}">`}</label>`).join('')}</div>
    <fieldset class="rq-fs"><legend>사용처</legend><div class="rq-g3">
      <label class="f req-l" for="rq-fac">공장명*${sel('rq-fac', PL.map(x => x[0]), r?.factory)}</label>
      <label class="f req-l" for="rq-line">라인명*${lineCtl}</label>
      <p class="dim" style="margin:0;font-size:12px;align-self:end">모든 자재가 이 공장·라인으로 요청돼요. 다른 라인에서 쓸 자재만 아래 표의 「라인」 칸에서 바꿔 주세요.</p>
    </div></fieldset>
    <fieldset class="rq-fs"><legend>자재정보</legend>
      ${ro ? '' : `<div class="ib-xls"><span><b>엑셀로 품목 넣기</b> · 서식을 내려받아 채운 뒤 올리면 아래 표에 채워져요.</span><span style="flex:1"></span><button type="button" class="btn sm" id="rq-tpl">서식 다운로드</button><label class="btn sm pri" for="rq-xls" style="margin:0">엑셀 업로드<input type="file" id="rq-xls" accept=".xlsx,.xls,.xlsm,.csv" hidden></label></div>`}
      <div class="tbl"><table class="rq-t"><thead><tr><th>No.</th><th>라인</th><th>납기요청일</th><th>자재코드 / 자재명 / 규격</th><th>거래처</th><th>발주량</th><th>단가</th><th>단위</th><th>금액</th><th>비고</th>${lines.some(l => l.orderId) ? '<th></th>' : ''}</tr></thead><tbody id="rq-rows">${lines.map(rowHTML).join('')}</tbody></table></div>
      <div class="rq-foot">${ro ? '' : '<button type="button" class="btn sm" id="rq-add">+ 행 추가</button>'}<span style="flex:1"></span><span>합계 (부가세 별도)</span><b class="mono" id="rq-sum">0원</b></div>
    </fieldset>
    ${r?.status === '반려' && r.rejectReason ? `<div class="form-alert">반려 사유: ${esc(r.rejectReason)}</div>` : ''}
  </div>`;
  const title = edit ? `구매요청 ${esc(r.reqNo || '')} ${pill(reqStatusLabel(r.status))}` : '구매요청 작성';
  const foot = ro ? `<span style="flex:1"></span><button type="button" class="btn" data-act="close">닫기</button>`
    : `${edit ? `<button type="button" class="btn ghost danger" data-act="delRequest" data-id="${r.id}">삭제</button>` : ''}<span style="flex:1"></span><button type="button" class="btn" data-act="close">취소</button>${r?.status === '대기' ? `<button type="submit" class="btn pri" data-mode="keep">저장</button>` : `<button type="submit" class="btn" data-mode="draft">임시 저장</button><button type="submit" class="btn pri" data-mode="submit">승인 요청</button>`}`;
  fm = modal(title, body, foot, 'x');
  const rowsEl = fm.querySelector('#rq-rows');
  const recalc = () => { let s = 0; rowsEl.querySelectorAll('[data-row]').forEach(tr => { const v = amt(tr.querySelector('[data-c=qty]').value, tr.querySelector('[data-c=price]').value); tr.querySelector('[data-c=amt]').value = v ? fmt(Math.round(v)) : ''; s += v; }); fm.querySelector('#rq-sum').textContent = won(s); };
  const fill = (tr, what) => {
    const id = pickId(tr.querySelector('[data-c=item]').value), it = item(id);
    const sEl = tr.querySelector('[data-c=sup]'), pEl = tr.querySelector('[data-c=price]');
    tr.querySelector('[data-c=unit]').value = it?.unit || '';
    if (!id) return recalc();
    if (what === 'item' && (!sEl.value || sEl.dataset.auto)){ const lp = latestPrice(id); sEl.value = lp ? priceSup(lp) : ''; sEl.dataset.auto = '1'; }
    if (!pEl.value || pEl.dataset.auto){ const sid = supIdByName(sEl.value); const lp = (sid && latestPrice(id, sid)) || (!sid && latestPrice(id)); pEl.value = lp ? fmtIn(lp.price) : ''; pEl.dataset.auto = lp ? '1' : ''; }
    recalc();
  };
  if (!ro){
    fm.addEventListener('change', e => { const tr = e.target.closest('[data-row]'); if (!tr) return; const c = e.target.dataset.c;
      if (c === 'item') fill(tr, 'item'); else if (c === 'sup') fill(tr, 'sup'); });
    const growRq = tr => { if (tr && tr === rowsEl.lastElementChild && ['item','qty','sup','note'].some(c => tr.querySelector(`[data-c=${c}]`)?.value.trim())) rowsEl.insertAdjacentHTML('beforeend', rowHTML({}, rowsEl.children.length)); };
    fm.addEventListener('input', e => { const c = e.target.dataset?.c; if (c === 'price' || c === 'sup') delete e.target.dataset.auto; if (c === 'qty' || c === 'price') recalc(); growRq(e.target.closest('[data-row]')); });
    fm.querySelector('#rq-add').onclick = () => { const k = rowsEl.children.length; rowsEl.insertAdjacentHTML('beforeend', rowHTML({}, k)); };
    fm.querySelector('#rq-tpl').onclick = () => reqTemplateXls(defFac());
    fm.querySelector('#rq-xls').onchange = async e => {
      const file = e.target.files?.[0]; e.target.value = ''; if (!file) return;
      if (!window.XLSX){ toast('엑셀 모듈을 불러오지 못했어요.'); return; }
      let res; try { res = parseReqXls(await file.arrayBuffer()); } catch(_) { res = null; }
      if (!res || !res.rows.length){ toast('엑셀에서 품목을 찾지 못했어요. 「품번」 또는 「품명」 머리글이 있는 서식인지 확인해 주세요.'); return; }
      const isEmpty = tr => !['item', 'qty', 'sup', 'note'].some(c => tr.querySelector(`[data-c=${c}]`)?.value.trim());
      [...rowsEl.querySelectorAll('[data-row]')].forEach(tr => { if (isEmpty(tr)) tr.remove(); });
      /* 업로드한 라인 우선: 공장·기본 라인이 비어 있으면 라인으로 공장을 찾아 채움 */
      const upLines = res.rows.map(d => d.line).filter(Boolean);
      if (upLines.length){
        const facEl = fm.querySelector('#rq-fac'), lnEl = fm.querySelector('#rq-line');
        const pf = PL.find(([, ls]) => upLines.every(l => ls.includes(l))) || PL.find(([, ls]) => ls.includes(upLines[0]));
        if (pf && (!facEl.value || !upLines.some(l => linesOf(facEl.value).includes(l))) && facEl.value !== pf[0]){ facEl.value = pf[0]; lnEl.innerHTML = opt([['', '========'], ...linesOf(pf[0]).map(x => [x, x])], ''); }
        if (!lnEl.value){ const cnt = {}; upLines.forEach(l => cnt[l] = (cnt[l] || 0) + 1); const top = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0][0]; if (![...lnEl.options].some(o => o.value === top)) lnEl.insertAdjacentHTML('beforeend', `<option>${esc(top)}</option>`); lnEl.value = top; }
        applyDef();
      }
      const lineOk = linesOf(defFac());
      let nBad = 0, nLine = 0;
      for (const d of res.rows){
        rowsEl.insertAdjacentHTML('beforeend', rowHTML({}, rowsEl.children.length)); const tr = rowsEl.lastElementChild, g = c => tr.querySelector(`[data-c=${c}]`);
        if (d.line && d.line !== defLine()){ const el = g('line'); el.outerHTML = lineSel(d.line); if (!lineOk.includes(d.line)){ g('line').classList.add('missing'); nLine++; } }
        if (d.needBy) g('needBy').value = d.needBy;
        if (d.itemId){ g('item').value = itemPickLabel(item(d.itemId)); fill(tr, 'item'); } else { g('item').value = d.text; g('item').classList.add('missing'); nBad++; }
        if (d.sup){ g('sup').value = d.sup; delete g('sup').dataset.auto; if (!supIdByName(d.sup)) g('sup').classList.add('missing'); if (!d.price){ g('price').dataset.auto = '1'; } fill(tr, 'sup'); }
        if (d.qty) g('qty').value = fmtIn(d.qty);
        if (d.price){ g('price').value = fmtIn(d.price); delete g('price').dataset.auto; }
        if (d.note) g('note').value = d.note;
      }
      rowsEl.insertAdjacentHTML('beforeend', rowHTML({}, rowsEl.children.length));
      [...rowsEl.querySelectorAll('[data-row]')].forEach((tr, i) => { tr.firstElementChild.textContent = i + 1; });
      recalc();
      fm.querySelector('.form-alert.x')?.remove();
      const warn = [nBad ? `${nBad}개 줄은 품목을 찾지 못했어요. 빨간 칸에서 품목을 목록에서 골라 주세요.` : '', nLine ? `${nLine}개 줄은 「${defFac() || '공장'}」 라인 목록에 없는 라인이에요. 엑셀에 적힌 라인으로 넣었으니 맞는지 확인해 주세요.` : ''].filter(Boolean).join(' ');
      if (warn) fm.querySelector('.rq').insertAdjacentHTML('afterbegin', `<div class="form-alert x" role="alert">${esc(warn)}</div>`);
      toast(`엑셀에서 품목 ${res.rows.length}개를 불러왔어요.`);
    };
  }
  /* 기본 사용처를 바꾸면 직접 바꾸지 않은 줄에 적용 */
  const applyDef = () => { if (ro) return; rowsEl.querySelectorAll('[data-row]').forEach(tr => { const lEl = tr.querySelector('[data-c=line]'); const v = lEl.value && linesOf(defFac()).includes(lEl.value) && lEl.value !== defLine() ? lEl.value : ''; lEl.outerHTML = lineSel(v); }); };
  fm.querySelector('#rq-fac').addEventListener('change', e => { fm.querySelector('#rq-line').innerHTML = opt([['', '========'], ...linesOf(e.target.value).map(x => [x, x])], ''); applyDef(); });
  fm.querySelector('#rq-line').addEventListener('change', applyDef);
  const clrNeed = () => { const fs = fm.querySelector('#rq-fac').closest('fieldset'); if (fm.querySelector('#rq-fac').value && fm.querySelector('#rq-line').value){ fs.classList.remove('rq-need'); fs.querySelector('.rq-need-msg')?.remove(); } };
  fm.querySelector('#rq-fac').addEventListener('change', clrNeed); fm.querySelector('#rq-line').addEventListener('change', clrNeed);
  recalc();
  if (ro) return;
  fm.addEventListener('click', e => { const b = e.target.closest('[data-mode]'); if (b) fm._mode = b.dataset.mode; });
  fm.onsubmit = async e => {
    e.preventDefault();
    const mode = e.submitter?.dataset?.mode || fm._mode || 'submit'; fm._mode = null;
    fm.querySelector('.form-alert.v')?.remove(); fm.querySelectorAll('.missing').forEach(x => x.classList.remove('missing'));
    const bad = [];
    const need = mode === 'draft' ? [['rq-date','요청일'], ['rq-fac','사용처 공장명'], ['rq-line','사용처 라인명']] : [['rq-date','요청일'], ['rq-mgr','담당자'], ['rq-fac','사용처 공장명'], ['rq-line','사용처 라인명']];
    for (const [id, lab] of need){ const el = fm.querySelector('#' + id); if (!el.value.trim()) bad.push({el, lab}); }
    const ls = [], msgs = [];
    rowsEl.querySelectorAll('[data-row]').forEach((tr, i) => {
      const get = c => tr.querySelector(`[data-c=${c}]`);
      const txt = get('item').value.trim(), id = pickId(txt), q = n(get('qty').value);
      if (!txt && !q) return;
      if (!id){ bad.push({el: get('item'), msg: `${i + 1}번 줄 자재는 목록에서 골라 주세요.`}); return; }
      if (!(q > 0)){ bad.push({el: get('qty'), msg: `${i + 1}번 줄 발주량을 입력해 주세요.`}); return; }
      const sname = get('sup').value.trim(), sid = supIdByName(sname), old = lines[i] || {};
      ls.push({factory: fm.querySelector('#rq-fac').value, line: get('line').value || fm.querySelector('#rq-line').value, needBy: get('needBy').value, itemId: id, supplierId: sid, supplierName: sid ? '' : sname, qty: q, price: prc(get('price').value), unit: get('unit').value, note: get('note').value.trim(), ...(old.orderId && old.itemId === id ? {orderId: old.orderId} : {})});
    });
    if (mode !== 'draft' && !ls.length && !bad.some(b => b.msg)) bad.push({el: rowsEl.querySelector('[data-c=item]'), msg: '자재를 한 줄 이상 입력해 주세요.'});
    if (bad.length){
      bad.forEach(b => b.el.classList.add('missing'));
      const labs = bad.filter(b => b.lab).map(b => b.lab);
      const text = [labs.some(l => l.startsWith('사용처')) ? '사용처(공장명·라인명)는 꼭 선택해야 해요.' : '', labs.filter(l => !l.startsWith('사용처')).length ? `${labs.filter(l => !l.startsWith('사용처')).join(', ')}을(를) 기입해 주세요.` : '', ...bad.filter(b => b.msg).map(b => b.msg)].filter(Boolean).join(' ');
      const useFs = fm.querySelector('#rq-fac').closest('fieldset'); useFs.classList.toggle('rq-need', labs.some(l => l.startsWith('사용처')));
      if (labs.some(l => l.startsWith('사용처'))){ useFs.querySelector('.rq-need-msg')?.remove(); useFs.insertAdjacentHTML('afterbegin', '<div class="rq-need-msg" role="alert">사용처(공장명·라인명)를 선택해 주세요. 사용처가 없으면 구매요청을 저장할 수 없어요.</div>'); useFs.scrollIntoView?.({block: 'center'}); }
      fm.querySelector('.rq').insertAdjacentHTML('afterbegin', `<div class="form-alert v" role="alert">${esc(text)}</div>`);
      bad[0].el.focus(); toast(text); return;
    }
    const picked = [0,1,2].map(i => fm.querySelector('#rq-f' + i)?.files?.[0]).map((f, i) => f ? {f, i} : null).filter(Boolean);
    const btn = fm.querySelector('[type=submit]'); btn.disabled = true;
    const ok = await save(async () => {
      const fl = files.slice();
      if (picked.length && !assetsApi) toast('이 화면에서는 첨부파일을 저장할 수 없어요. 요청 내용만 저장할게요.');
      for (const {f, i} of picked) if (assetsApi){ try { const up = await assetsApi.upload(f, f.type ? {} : {type: 'application/pdf'}); fl[i] = {id: up.id, name: f.name}; } catch(_) { toast(`첨부파일_${i + 1}을 저장하지 못했어요.`); } }
      const date = fm.querySelector('#rq-date').value;
      const doc = {reqDate: date, manager: fm.querySelector('#rq-mgr').value.trim(), note: fm.querySelector('#rq-note').value.trim(), files: fl.filter(Boolean),
        factory: fm.querySelector('#rq-fac').value,
        line: [...new Set(ls.map(l => l.line).filter(Boolean))].length > 1 ? '여러 라인' : fm.querySelector('#rq-line').value.trim(),
        lines: ls, total: ls.reduce((a, l) => a + amt(l.qty, l.price), 0)};
      const st = mode === 'draft' ? '요청대기' : '대기';
      if (mode !== 'keep'){ doc.status = st; if (st === '대기') doc.submittedAt = nowIso(); if (r?.status === '반려') doc.rejectReason = ''; }
      if (edit) await col('requests').doc(r.id).update(doc);
      else await col('requests').add({...doc, reqNo: nextReqNo(date), createdAt: nowIso(), createdBy: uid});
    });
    btn.disabled = false;
    if (ok){ closeModal(); flt.req = mode === 'draft' ? '구매요청 대기' : '승인중'; render(); toast(mode === 'draft' ? '임시 저장했어요. 「구매요청 대기」에서 이어서 작성할 수 있어요.' : mode === 'keep' ? '구매요청을 저장했어요.' : '승인 요청했어요. 현업 승인을 기다려요.'); }
  };
}

function reqTable(rows){
  return `<div class="tbl"><table><thead><tr><th>발주요청번호</th><th>요청일</th><th>담당자</th><th>사용처</th><th>자재</th><th>납기요청</th><th class="num">금액</th><th>상태</th><th></th></tr></thead><tbody>${rows.map(r => {
    const ls = reqLines(r), first = ls[0], due = ls.map(l => l.needBy).filter(Boolean).sort()[0];
    let acts = `<button class="btn sm" data-act="viewRequest" data-id="${r.id}">${reqEditable(r) ? '수정' : '상세'}</button>`;
    if (r.status === '요청대기') acts += `<button class="btn sm pri" data-act="submitRequest" data-id="${r.id}">승인 요청</button><button class="btn sm ghost danger" data-act="delRequest" data-id="${r.id}">삭제</button>`;
    else if (r.status === '대기') acts += `<button class="btn sm pri" data-act="approve" data-id="${r.id}">현업 승인</button><button class="btn sm" data-act="reject" data-id="${r.id}">반려</button>`;
    else if (isReqPending(r)) acts += `<button class="btn sm" data-act="go" data-k="orders" data-f="발주대기">발주 탭에서 보기</button>`;
    const late = due && due < today() && (r.status === '대기' || r.status === '승인');
    return `<tr><td class="mono nowrap">${reqNoCell(r)}</td><td class="mono">${md(r.reqDate || (r.createdAt || '').slice(0,10))}</td><td class="nowrap">${r.manager ? esc(r.manager) : who(r.createdBy)}</td><td class="nowrap">${esc(reqUse(r))}</td><td>${r.preIn ? `<span class="pill p-wait" style="margin-right:4px">선입고 ${esc(r.preNo || '')}</span>` : ''}${first ? esc(lineLabel(first)) : '–'}${ls.length > 1 ? ` <span class="dim">외 ${ls.length - 1}건</span>` : ''}</td><td class="mono ${late ? 'low' : ''}">${md(due)}</td><td class="num">${reqTotal(r) ? fmt(reqTotal(r)) : '–'}</td><td>${pill(reqStatusLabel(r.status))}${r.approverName ? `<div class="dim" style="font-size:11px">승인 ${esc(r.approverName)}</div>` : ''}</td><td><div class="act">${acts}</div></td></tr>${reqItemsRow(r, 9)}`;
  }).join('')}</tbody></table></div>`;
}

const reqNoCell = r => `<button type="button" class="reqno" data-act="toggleReq" data-id="${r.id}" aria-expanded="${!!flt.openReq?.[r.id]}"><span class="caret">${flt.openReq?.[r.id] ? '▾' : '▸'}</span>${esc(r.reqNo || '–')}</button>`;
function ordItemsRow(o, cols){
  const ls = o.lines || [];
  return `<tr class="sub"><td colspan="${cols}"><div class="tbl"><table class="subt"><thead><tr><th>No.</th><th>품번</th><th>품명</th><th>규격</th><th class="num">발주량</th><th>단위</th><th class="num">단가</th><th class="num">금액</th><th>납기</th><th class="num">입고</th><th class="num">잔량</th></tr></thead><tbody>${ls.map((l, i) => { const it = item(l.itemId) || {}, rc = n((o.received || [])[i]); return `<tr><td>${i + 1}</td><td class="mono">${esc(it.code || '')}</td><td>${esc(it.name || '(삭제된 품목)')}</td><td class="dim">${esc(it.spec || '')}</td><td class="num">${fmt(l.qty)}</td><td>${esc(it.unit || '')}</td><td class="num">${fmt(prc(l.price))}</td><td class="num">${fmt(amt(l.qty, l.price))}</td><td class="mono nowrap">${esc(l.due || o.dueDate || '')}</td><td class="num">${fmt(rc)}</td><td class="num">${fmt(Math.max(0, n(l.qty) - rc))}</td></tr>`; }).join('') || '<tr><td colspan="11" class="dim">품목이 없어요.</td></tr>'}<tr><td colspan="7"><b>합계 (부가세 별도)</b></td><td class="num"><b>${fmt(orderTotal(o))}</b></td><td colspan="3"></td></tr></tbody></table></div></td></tr>`;
}
function reqItemsRow(r, cols){
  if (!flt.openReq?.[r.id]) return '';
  const ls = reqLines(r).filter(l => l.itemId || l.name);

async function saveItem(it, data){

    let bad = miss.map(el => ({el, label: (el.closest('label')?.firstChild?.textContent || '필수 항목').replace(/\*/g, '').trim()}));
    const extra = fm._validate ? fm._validate() : [];

    if (bad.length){
      bad.forEach(b => b.el.classList.add('missing'));
      const names = [...new Set(bad.filter(b => !b.msg).map(b => b.label))];

      fm.querySelector('.mb').scrollIntoView?.({block:'nearest'});

    const btn = fm.querySelector('[type=submit]'); btn.disabled = true;

let sampleFn = null, assetsApi = null, pdfReady = null;
function loadPdfJs(){
  return pdfReady ||= new Promise((res, rej) => {
    const base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
    const add = src => new Promise((r, j) => { const sc = document.createElement('script'); sc.src = base + src; sc.onload = r; sc.onerror = j; document.head.appendChild(sc); });
    add('pdf.min.js').then(() => add('pdf.worker.min.js')).then(() => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.js'; res(window.pdfjsLib); }).catch(e => { pdfReady = null; rej(e); });
  });
}
async function pdfFirstPage(file){
  const lib = await loadPdfJs();
  const doc = await lib.getDocument({data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false}).promise;
  const pg = await doc.getPage(1);
  let text = '';
  try { text = (await pg.getTextContent()).items.map(t => t.str).join(' ').replace(/\s+/g, ' ').slice(0, 4000); } catch(_) {}
  const vp = pg.getViewport({scale: 2});
  const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
  const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
  await pg.render({canvasContext: ctx, viewport: vp}).promise;
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  return {blob, text};
}
async function readDocImage(file, prompt){
  if (!sampleFn) throw {code: 'no_sample'};
  const lim = await sampleFn.limits().catch(() => null);
  if (!lim?.images) throw {code: 'no_sample'};
  let img = file, text = '';
  if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)){ const r = await pdfFirstPage(file); img = r.blob; text = r.text; }
  else if (!lim.images.mediaTypes.includes(file.type)) throw {code: 'bad_type'};
  return sampleFn.json(prompt + (text ? `\n\n참고: 같은 문서의 PDF 텍스트 레이어\n${text}` : ''), {images: [img]});
}

const DOCS = [['cert','사업자등록증'], ['bank','통장사본'], ['enote','전자어음수취확인서']];
const DOC_SHORT = {cert:'등록증', bank:'통장', enote:'어음확인서'};
const docOf = (s, k) => s?.docs?.[k] || (k === 'cert' && s?.certId ? {id: s.certId, name: s.certName, at: s.certAt} : null);
const isPdfName = f => f.type === 'application/pdf' || /\.pdf$/i.test(f.name);

function supplierForm(s, opts = {}){
  const fields = [
    {k:'name',label:'업체명',req:true,val:s?.name},
    {k:'region',label:'국내/해외',type:'select',html:opt([['국내','국내'],['해외','해외']], s?.region || '국내')},
    {k:'bizNo',label:'사업자등록번호',req:true,val:s?.bizNo,ph:'000-00-00000'},
    {k:'active',label:'사용 여부',type:'select',html:opt([['1','사용함'],['0','사용안함']], s?.active === false ? '0' : '1')},
    {k:'ceo',label:'대표자',val:s?.ceo},
    {k:'openDate',label:'개업연월일',val:s?.openDate,ph:'YYYY-MM-DD'},
    {k:'bizType',label:'업태',val:s?.bizType},
    {k:'bizItem',label:'종목',val:s?.bizItem},
    {k:'contact',label:'담당자',val:s?.contact,ph:'이름 / 연락처'},
    {k:'address',label:'주소',val:s?.address,full:true},
    {k:'phone',label:'전화번호',val:s?.phone,type:'tel'},
    {k:'fax',label:'FAX번호',val:s?.fax,type:'tel'},
    {k:'email',label:'이메일',val:s?.email,type:'email'},
    {k:'group',label:'대분류 (품의서 구분)',type:'select',html:opt([...ACCT_NAMES.map(a => [a, a]), ...(s?.group && !ACT_HAS(s.group) ? [[s.group, s.group + ' (기존 값)']] : [])], s?.group || '', '선택 안 함')},
    {k:'category',label:'취급품목',val:s?.category,ph:'예: 알루미늄 빌렛, 포장재'},
    {k:'payTerm',label:'결제조건',req:true,type:'select',html:termOpts(s?.payTerm)},
    {k:'bank',label:'은행',val:s?.bank,ph:'예: 기업은행'},
    {k:'account',label:'계좌번호',val:s?.account},
    {k:'holder',label:'예금주',val:s?.holder},
    {k:'note',label:'비고',val:s?.note,type:'textarea',full:true},
  ];
  const pending = {}, removed = new Set();
  let checked = s ? {biz: digits(s.bizNo), name: normName(s.name)} : null;
  const fm = form(s?'거래처 수정':'거래처 등록', fields, s?'저장':'등록', async v => {
    v = {...v, active: v.active !== '0', bizNo: fmtBiz(v.bizNo)};
    const dup = findDup(v.bizNo, v.name, s?.id);
    if (dup){ showDup(dup, v); return false; }
    return save(async () => {
      const docs = {}, failed = [];
      for (const [k, l] of DOCS){
        const f = pending[k], old = docOf(s, k);
        if (f){
          if (!assetsApi){ failed.push(l); continue; }
          try { const up = await assetsApi.upload(f, f.type && f.type !== 'application/octet-stream' ? {} : {type: isPdfName(f) ? 'application/pdf' : 'image/png'}); docs[k] = {id: up.id, name: f.name, at: nowIso(), by: uid}; }
          catch(_) { failed.push(l); continue; }
        } else if (removed.has(k) && old) docs[k] = null;
        else continue;
        if (old?.id && assetsApi) assetsApi.delete(old.id).catch(() => {});
        if (k === 'cert' && s?.certId){ v.certId = null; v.certName = null; v.certAt = null; }
      }
      if (Object.keys(docs).length) v.docs = docs;
      if (failed.length) toast(`${failed.join(', ')} 파일은 저장하지 못했어요. 파일 저장 권한을 확인해 주세요.`);
      if (s) await col('suppliers').doc(s.id).update(v);
      else await col('suppliers').add({...v, createdAt: nowIso(), createdBy: uid});
      toast(s?'저장했어요.':'거래처를 등록했어요.');
    });
  }, s ? `<button type="button" class="btn ghost danger" data-act="delSupplier" data-id="${s.id}">삭제</button>` : '');
  fm.style.position = 'relative';
  const isAbroad = () => fm.querySelector('#f-region').value === '해외';
  fm._skipReq = el => el.id === 'f-bizNo' && isAbroad();
  fm._validate = () => { const el = fm.querySelector('#f-bizNo'), d = digits(el.value); return !isAbroad() && el.value.trim() && d.length !== 10 ? [{el, msg: '사업자등록번호는 숫자 10자리로 입력해 주세요.'}] : []; };
  fm.addEventListener('input', e => { if (e.target.classList.contains('missing') && String(e.target.value).trim()) e.target.classList.remove('missing'); });
  fm.addEventListener('change', e => { if (e.target.classList.contains('missing') && String(e.target.value).trim()) e.target.classList.remove('missing'); });
  const mb = fm.querySelector('.mb');
  const ACCEPT = 'image/png,image/jpeg,image/webp,application/pdf,.pdf';
  mb.insertAdjacentHTML('afterbegin', `<div class="full docs">
      <div class="docs-h"><b>증빙 서류</b><span class="dim">이미지·PDF · 사업자등록증과 통장사본은 내용을 읽어 칸을 자동으로 채워요${assetsApi ? '' : ' · <span class="low">이 화면에서는 파일이 저장되지 않아요</span>'}</span></div>
      ${DOCS.map(([k, l]) => `<div class="doc-row"><span class="doc-l">${l}</span><span class="doc-st" id="ds-${k}"></span><span class="doc-b"><label class="btn sm" for="df-${k}" id="dl-${k}">올리기</label><button type="button" class="btn sm ghost danger" id="dd-${k}">삭제</button></span><input type="file" id="df-${k}" accept="${ACCEPT}" hidden></div>`).join('')}
      <div class="doc-msg" id="doc-msg" hidden></div>
    </div>`);
  const rowSt = k => {
    const el = fm.querySelector('#ds-' + k), old = docOf(s, k), f = pending[k];
    if (f) el.innerHTML = `<span class="pill p-info">새 파일</span> ${esc(f.name)} <span class="dim">· ${s ? '저장' : '등록'}할 때 올라가요</span>`;
    else if (removed.has(k) && old) el.innerHTML = `<span class="pill p-bad">삭제 예정</span> <s class="dim">${esc(old.name || '')}</s>`;
    else if (old) el.innerHTML = `<a href="/_blob/${esc(old.id)}" target="_blank" rel="noopener">${esc(old.name || '파일 보기')}</a> <span class="dim mono">${esc((old.at || '').slice(0,10))}</span>`;
    else el.innerHTML = '<span class="dim">미등록</span>';
    fm.querySelector('#dl-' + k).textContent = f || (old && !removed.has(k)) ? '바꾸기' : '올리기';
    fm.querySelector('#dd-' + k).hidden = !(f || (old && !removed.has(k)));
  };
  DOCS.forEach(([k]) => rowSt(k));
  const msg = (html) => { const m = fm.querySelector('#doc-msg'); m.innerHTML = html; m.hidden = !html; };
  DOCS.forEach(([k, l]) => fm.querySelector('#dd-' + k).onclick = () => { if (pending[k]) delete pending[k]; else removed.add(k); fm.querySelector('#df-' + k).value = ''; rowSt(k); });
  const bizLbl = fm.querySelector('#f-bizNo').closest('label');
  bizLbl.insertAdjacentHTML('beforeend', `<span class="dupline"><span id="dup-st"></span><button type="button" class="btn sm" id="dup-btn">중복 확인</button></span>`);
  const st = fm.querySelector('#dup-st');
  const setSt = () => {
    const b = digits(fm.querySelector('#f-bizNo').value), nm = normName(fm.querySelector('#f-name').value);
    if (checked && checked.biz === b && checked.name === nm) st.innerHTML = b || nm ? '<span class="pill p-ok">중복 없음</span>' : '';
    else st.innerHTML = b || nm ? '<span class="pill p-wait">중복 확인 필요</span>' : '';
  };
  const runCheck = () => {
    const v = {bizNo: fm.querySelector('#f-bizNo').value, name: fm.querySelector('#f-name').value};
    const dup = findDup(v.bizNo, v.name, s?.id);
    if (dup){ checked = null; setSt(); showDup(dup, v); return false; }
    checked = {biz: digits(v.bizNo), name: normName(v.name)}; setSt();
    return true;
  };
  fm.querySelector('#dup-btn').onclick = () => { if (runCheck()) toast('등록된 업체와 겹치지 않아요.'); };
  fm.addEventListener('input', e => { if (e.target.id === 'f-bizNo' || e.target.id === 'f-name') setSt(); });
  setSt();

  function showDup(dup, v){
    fm.querySelector('.dup-ov')?.remove();
    const x = dup.sup, byBiz = dup.by === 'bizNo';
    toast(byBiz ? '이미 등록된 사업자번호라서 등록할 수 없어요.' : '같은 이름의 업체가 이미 있어서 등록할 수 없어요.');
    fm.insertAdjacentHTML('beforeend', `<div class="dup-ov"><div class="dup-box" role="alertdialog" aria-labelledby="dup-h">
      <h3 id="dup-h">이미 등록된 업체예요</h3>
      <p>${byBiz ? `사업자번호 <b class="mono">${esc(fmtBiz(v.bizNo))}</b>` : `업체명 <b>${esc(v.name)}</b>`}은(는) <b>${esc(x.name)}</b>${x.no ? ` (No.${esc(x.no)})` : ''}${x.active === false ? ' · 사용안함' : ''}으로 등록되어 있어 <b class="low">등록할 수 없어요.</b></p>
      <label class="f" for="dup-in">중복 확인 필요 — ${byBiz ? '사업자번호' : '업체명'}를 다시 확인해 입력하세요<input id="dup-in" value="${esc(byBiz ? fmtBiz(v.bizNo) : v.name)}" ${byBiz ? 'inputmode="numeric"' : ''}></label>
      <p id="dup-msg" class="dim" style="margin:0;font-size:12.5px">값을 고친 뒤 [중복 확인]을 누르세요.</p>
      <div class="dup-actions">${!s || x.id !== s.id ? `<button type="button" class="btn ghost" id="dup-open">기존 업체 열기</button>` : ''}<span style="flex:1"></span><button type="button" class="btn" id="dup-close">닫기</button><button type="button" class="btn pri" id="dup-re">중복 확인</button></div>
    </div></div>`);
    const ov = fm.querySelector('.dup-ov'), inp = ov.querySelector('#dup-in');
    inp.focus(); inp.select();
    ov.querySelector('#dup-close').onclick = () => ov.remove();
    ov.querySelector('#dup-open')?.addEventListener('click', () => supplierForm(x));
    const re = () => {
      const val = inp.value.trim();
      const d2 = byBiz ? findDup(val, '', s?.id) : findDup('', val, s?.id);
      const msg = ov.querySelector('#dup-msg');
      if (!val){ msg.className = 'low'; msg.textContent = '값을 입력해 주세요.'; return; }
      if (byBiz && digits(val).length !== 10){ msg.className = 'low'; msg.textContent = '사업자번호는 숫자 10자리예요.'; return; }
      if (d2){ msg.className = 'low'; msg.textContent = `여전히 중복이에요: ${d2.sup.name}${d2.sup.no ? ' (No.' + d2.sup.no + ')' : ''}. 등록할 수 없어요.`; inp.select(); return; }
      fm.querySelector(byBiz ? '#f-bizNo' : '#f-name').value = byBiz ? fmtBiz(val) : val;
      checked = null; ov.remove(); runCheck();
      toast('중복이 없어요. 내용을 확인한 뒤 등록을 눌러 주세요.');
    };
    ov.querySelector('#dup-re').onclick = re;
    inp.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); re(); } });
  }

  const fillFrom = (r, map) => { const filled = []; for (const [k, id] of Object.entries(map)){ let val = String(r[k] ?? '').trim(); if (!val) continue; if (k === 'bizNo') val = fmtBiz(val); const el = fm.querySelector('#' + id); if (el){ el.value = val; el.classList.add('autofill'); filled.push(k); } } return filled; };
  const readErr = c => c === 'no_sample' || c === 'not_granted' || c === 'sampling_disabled' || c === 'images_unavailable' ? '이 화면에서는 자동 읽기를 쓸 수 없어요. 직접 입력해 주세요.' : c === 'bad_type' || c === 'image_rejected' ? 'JPG·PNG·PDF 파일만 읽을 수 있어요.' : c === 'rate_limited' ? '요청이 많아요. 잠시 후 다시 올려 주세요.' : '파일을 읽지 못했어요. 선명한 이미지로 다시 올리거나 직접 입력해 주세요.';
  DOCS.forEach(([k, l]) => fm.querySelector('#df-' + k).addEventListener('change', async e => {
    const f = e.target.files?.[0]; if (!f) return;
    pending[k] = f; removed.delete(k); rowSt(k);
    if (k === 'enote') return;
    msg(`<b>${l}</b> 읽는 중… (보통 10~40초)`);
    try {
      const r = await readDocImage(f, k === 'cert' ? CERT_PROMPT : BANK_PROMPT);
      if (pending[k] !== f) return;
      if (!r || r.error){ msg(`<span class="low">${l}(으)로 읽히지 않아요. 파일을 확인하거나 직접 입력해 주세요.</span> 파일은 그대로 저장돼요.`); return; }
      if (k === 'cert'){
        const filled = fillFrom(r, {name:'f-name', bizNo:'f-bizNo', ceo:'f-ceo', address:'f-address', bizType:'f-bizType', bizItem:'f-bizItem', openDate:'f-openDate'});
        fm.querySelector('#f-region').value = '국내';
        msg(`<b>사업자등록증</b>에서 ${filled.length}개 항목을 채웠어요. <span class="low">원본과 한 번 대조해 주세요.</span>`);
        checked = null; setSt(); runCheck();
      } else {
        const filled = fillFrom(r, {bank:'f-bank', account:'f-account', holder:'f-holder'});
        msg(`<b>통장사본</b>에서 ${filled.length ? '은행·계좌번호·예금주를' : '읽은 항목이 없어'} ${filled.length ? '채웠어요. <span class="low">원본과 한 번 대조해 주세요.</span>' : '직접 입력해 주세요.'}`);
      }
    } catch(err){ if (pending[k] === f) msg(`<span class="low">${readErr(err?.code)}</span> 파일은 그대로 저장돼요.`); }
  }));
  if (opts.pick) fm.querySelector('#df-cert').click();
}

/* items */
function itemForm(it){
  const fields = [
    {k:'account',label:'대분류',req:true,type:'select',html:opt(ACCOUNTS.map(a => [a.acct, `${a.acct} (${a.c1})`]), it?.account || '', '대분류 선택')},
    {k:'code2',label:'중분류',req:true,type:'select',html:subOpts(it?.account, it?.code2)},
    {k:'code',label:'품번 (자동 부여)',val:it?.code},
    {k:'name',label:'품명',req:true,val:it?.name},
    {k:'spec',label:'규격',val:it?.spec,ph:'예: Ø178 × 6000'},
    {k:'unit',label:'단위',req:true,val:it?.unit||'EA',list:UNITS},
    {k:'safetyStock',label:'안전재고',val:it?.safetyStock??'',type:'number',step:'any'},
    {k:'openingStock',label:'기초재고 (등록 시점 수량)',val:it?.openingStock??0,type:'number',step:'any'},
    ...(isOuts(it) ? [{k:'matPrice',label:'소재단가 (외주 가공불량 정산용, 원)',val:it?.matPrice ? fmtIn(it.matPrice) : '',cls:'nf',ph:'예: 50,000'}] : []),
  ];
  const fm = form(it?'품목 수정':'품목 등록', fields, it?'저장':'등록', v => save(async () => {
    const a = acctOf(v.account), sub = a?.subs.find(x => x[1] === v.code2);
    const same = (it?.scheme && it.code) || (it && it.account === v.account && it.code2 === v.code2 && it.code);
    const code = same ? it.code : nextItemCode(a.c1, v.code2, it?.id);
    const d = {...v, code, code1: a.c1, subAccount: sub?.[0] || '', category: v.account, safetyStock: n(v.safetyStock), openingStock: n(v.openingStock)};
    if ('matPrice' in v) d.matPrice = n(v.matPrice) || 0;
    if (!it) d.createdAt = nowIso(), d.createdBy = uid;
    if (it?.flag && !same) d.flag = null;
    await saveItem(it, d);
    toast(`${code} ${it ? '저장했어요.' : '품목을 등록했어요.'}`);
  }), it ? `<button type="button" class="btn ghost danger" data-act="delItem" data-id="${it.id}">삭제</button>` : '');
  const codeEl = fm.querySelector('#f-code'); codeEl.readOnly = true; codeEl.classList.add('mono');
  const preview = () => {
    const acct = fm.querySelector('#f-account').value, c2 = fm.querySelector('#f-code2').value, a = acctOf(acct);
    if (!a || !c2){ codeEl.value = it?.code || ''; codeEl.placeholder = '대분류·중분류를 고르면 정해져요'; return; }
    codeEl.value = (it?.scheme && it.code) || (it && it.account === acct && it.code2 === c2 && it.code) ? it.code : nextItemCode(a.c1, c2, it?.id);
  };
  fm.addEventListener('change', e => {
    if (e.target.id === 'f-account'){ fm.querySelector('#f-code2').innerHTML = subOpts(e.target.value, ''); }
    if (e.target.id === 'f-account' || e.target.id === 'f-code2') preview();
  });
  preview();
  /* 품명+규격 중복 확인 */
  const nk = v => String(v ?? '').replace(/\s/g, '').toUpperCase();
  const dupOf = () => { const nm = nk(fm.querySelector('#f-name').value), sp = nk(fm.querySelector('#f-spec').value); if (!nm || !sp) return []; return S.items.filter(x => x.id !== it?.id && nk(x.name) === nm && nk(x.spec) === sp); };
  fm.querySelector('#f-spec').closest('label').insertAdjacentHTML('afterend', `<div class="full item-dup" id="item-dup" hidden></div>`);
  const box = fm.querySelector('#item-dup');
  const check = () => {
    const d = dupOf();
    if (!d.length){ box.hidden = true; box.innerHTML = ''; return d; }
    const was = fm.querySelector('#dup-ok')?.checked;
    box.hidden = false;
    box.innerHTML = `<b>중복 확인 필요.</b> 품명·규격이 같은 품목이 이미 있어요: ${d.slice(0, 3).map(x => `<span class="mono">${esc(x.code || '품번없음')}</span> ${esc(x.name)}${x.spec ? ' · ' + esc(x.spec) : ''}${x.inactive ? ' (사용안함)' : ''}`).join(', ')}${d.length > 3 ? ` 외 ${d.length - 3}건` : ''}
      <label class="dup-ok"><input type="checkbox" id="dup-ok" ${was ? 'checked' : ''}> 중복을 확인했고, 그래도 ${it ? '저장' : '등록'}할게요</label>`;
    return d;
  };
  fm.addEventListener('input', e => { if (e.target.id === 'f-name' || e.target.id === 'f-spec') check(); });
  check();
  fm._validate = () => {
    const d = check();
    if (d.length && !fm.querySelector('#dup-ok')?.checked){ const el = fm.querySelector('#f-name'); return [{el, msg: '중복 확인 필요. 품명·규격이 같은 품목이 있어요. 확인 후 체크해 주세요.'}]; }
    return [];
  };
}

const ITEM_XLS_HEAD = ['대분류', '중분류', '품명', '규격', '단위', '거래처', '단가'];
async function itemTemplateXls(){
  if (!window.XLSX){ toast('엑셀 모듈을 불러오지 못했어요.'); return; }
  const bd = {style: 'thin', color: {rgb: '999999'}}, B = {top: bd, bottom: bd, left: bd, right: bd};
  const H = {font: {name: '맑은 고딕', sz: 10, bold: true}, fill: {patternType: 'solid', fgColor: {rgb: 'DCE6F1'}}, alignment: {horizontal: 'center', vertical: 'center'}, border: B};
  const HR = {...H, font: {...H.font, color: {rgb: 'C00000'}}};
  const C = {font: {name: '맑은 고딕', sz: 10}, border: B};
  const ex = [['원자재', 'INGOT', 'INGOT', 'A356.2(AC4CH)', 'KG', '(주)신우텍', 4200], ['소모품', '생산성', '엔드밀', 'Ø10 4날', 'EA', '', ''], ['공기구', '소모공구', '드릴', 'Ø8.5', 'EA', '', '']];

  ws['!cols'] = [12, 18, 26, 22, 8, 22, 12].map(w => ({wch: w}));

  const ws2 = XLSX.utils.aoa_to_sheet(cls); ws2['!cols'] = [12, 20, 12, 14].map(w => ({wch: w}));
  cls[0].forEach((_, c) => { ws2[XLSX.utils.encode_cell({r: 0, c})].s = H; });
  const ws3 = XLSX.utils.aoa_to_sheet([['단위'], ...UNITS.map(u => [u])]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '품목등록'); XLSX.utils.book_append_sheet(wb, ws2, '분류표'); XLSX.utils.book_append_sheet(wb, ws3, '단위');
  const buf = XLSX.write(wb, {bookType: 'xlsx', type: 'array'});
  if (!downloads){ toast('이 화면에서는 파일 저장을 지원하지 않아요.'); return; }
  try { await downloads.save({filename: '품목 일괄등록 양식.xlsx', data: new Blob([buf])}); toast('양식을 저장했어요. 예시 3줄은 지우고 채워 주세요.'); }
  catch(e){ if (e?.code !== 'declined') toast('파일을 저장하지 못했어요.'); }
}
function parseItemXls(buf){
  const wb = XLSX.read(buf, {type: 'array'});
  const nh = v => String(v ?? '').replace(/[\s*]/g, '');
  for (const sn of wb.SheetNames){
    const g = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header: 1, raw: true, defval: null});
    const H = g.findIndex(r => (r || []).some(v => nh(v) === '품명')); if (H < 0) continue;
    const col = {}; (g[H] || []).forEach((v, c) => { const h = nh(v);
      if (h === '대분류' || h === '계정') col.acct = c; else if (h === '중분류' || h === '소계정') col.sub = c; else if (h === '품명' || h === '자재명') col.name = c;
      else if (h === '규격') col.spec = c; else if (h === '단위') col.unit = c; else if (/거래처|매입처|업체/.test(h)) col.sup = c; else if (/단가/.test(h)) col.price = c; });
    const rows = [], warn = [];
    for (let r = H + 1; r < g.length; r++){
      const row = g[r] || [], val = k => col[k] == null ? '' : String(row[col[k]] ?? '').trim();
      const name = val('name'); if (!name) continue;
      const bad = [];
      const accTxt = val('acct').replace(/\s/g, ''), a = ACCOUNTS.find(x => x.acct === accTxt || x.acct.replace('/', '') === accTxt.replace('/', '') || x.c1 === accTxt.toUpperCase() && accTxt.length === 1);
      if (!a) bad.push('acct');
      const subTxt = val('sub').replace(/\s/g, '');
      const sub = a ? a.subs.find(([nm, c2]) => nm.replace(/\s/g, '') === subTxt || c2 === subTxt.toUpperCase() || nm.replace(/\s/g, '') === subTxt.replace(/\(.*\)$/, '')) : null;
      if (a && !sub && !(a.subs.length === 1 && !subTxt)) bad.push('sub');
      const supTxt = val('sup'); if (supTxt && !supIdByName(supTxt)) bad.push('sup');
      const pRaw = col.price == null ? '' : row[col.price], price = typeof pRaw === 'number' ? pRaw : numOf(pRaw);
      rows.push({acct: a?.acct || '', c2: sub?.[1] || '', name, spec: val('spec'), unit: val('unit') || 'EA', sup: supTxt, price: price ? String(price) : '', bad});
    }
    if (rows.length > 500) warn.push('한 번에 500줄까지만 불러왔어요.');
    return {sheet: sn, rows: rows.slice(0, 500), warn};
  }
  return null;
}
