  return `<div class="line" data-due="${esc(l.due||'')}" data-ln="${esc(l.line||'')}">${itemPick(l.itemId, 'data-l="itemId" aria-label="품목"')}<input data-l="qty" class="nf" inputmode="decimal" placeholder="수량" value="${esc(fmtIn(l.qty??''))}" aria-label="수량"><input data-l="price" class="nf" inputmode="decimal" placeholder="단가" value="${esc(fmtIn(l.price??''))}" aria-label="단가" ${l.auto?'data-auto="1"':''}><div class="tot">0원</div><button type="button" class="btn ghost sm" data-act="rmLine" aria-label="줄 삭제">✕</button></div>`;
}
const sel_unreg = r => { const u = reqLines(r).filter(l => !l.itemId && l.name && !l.orderId).map(l => l.name); return u.length ? ` 미등록 품목(${esc(u.join(', '))})은 품목을 골라 주세요.` : ''; };
function orderForm(reqId, idxs, po, pre){
  if (!S.suppliers.length || !S.items.length){ toast('거래처와 품목을 먼저 등록해 주세요.'); return; }
  const r = reqId ? byId('requests', reqId) : null;
  let sup = po?.supplierId || pre?.supplierId || '', lines = po ? (po.lines || []).map(l => ({...l})) : pre ? pre.lines.map(l => { const lp = latestPrice(l.itemId, pre.supplierId); return {itemId: l.itemId, qty: l.qty, price: lp ? prc(lp.price) : '', auto: !!lp}; }) : [{}];
  if (r){
    const rl = reqLines(r); idxs = idxs || rl.map((l, i) => i).filter(i => rl[i].itemId && !rl[i].orderId);
    const sel = idxs.map(i => rl[i]);
    sup = sel.find(l => l.supplierId)?.supplierId || '';
    lines = sel.map(l => { const lp = l.itemId && !n(l.price) && latestPrice(l.itemId, sup || undefined); return {itemId: l.itemId, qty: l.qty, price: prc(l.price) || (lp?.price ?? ''), auto: !n(l.price) && !!lp, due: l.needBy || '', line: lnLine(l, r)}; });
    r._fac = lnFac(sel[0], r); r._lines = [...new Set(sel.map(l => lnLine(l, r)).filter(Boolean))];
    r._due = sel.map(l => l.needBy).filter(Boolean).sort()[0];
  }
  const body = `<div class="mb">
    <label class="f" for="o-sup-q">거래처 <span class="req">*</span><input id="o-sup-q" list="dl-osup" autocomplete="off" placeholder="업체명 일부를 입력해 고르세요" value="${sup ? esc(ctSupLabel(sup)) : ''}"><datalist id="dl-osup">${ctSupList(sup).map(x => `<option value="${esc(x)}">`).join('')}</datalist><input type="hidden" id="o-sup" value="${esc(sup)}"><span class="dim" id="o-sup-hint" style="font-size:11.5px"></span></label>
    <label class="f" for="o-fac">입고 공장 <span class="req">*</span><select id="o-fac" required>${facOpts(po?.factory || pre?.factory || (FACTORIES.includes(r?._fac) ? r._fac : FACTORIES.includes(r?.factory) ? r.factory : FACTORIES[0]))}</select></label>
    <label class="f" for="o-date">발주일 <span class="req">*</span><input id="o-date" type="date" value="${today()}" required></label>
    <label class="f" for="o-due">납기일 <span class="req">*</span><input id="o-due" type="date" value="${po?.dueDate||r?._due||addDays(today(),7)}" required></label>
    <label class="f" for="o-dept">발주부서<input id="o-dept" value="${esc(po?.dept || lastPo().dept || '')}" placeholder="예: 생산관리팀_금형"></label>
    <label class="f" for="o-mgr">담당자<input id="o-mgr" value="${esc(po?.manager || r?.manager || lastPo().manager || ($('#who').textContent || '').replace(/ 님$/, ''))}"></label>
    <label class="f" for="o-tel">담당연락처<input id="o-tel" value="${esc(po?.managerTel || lastPo().tel || '')}" placeholder="010-0000-0000"></label>
    <label class="f" for="o-place">납품장소<input id="o-place" value="${esc(po?.deliveryPlace || (r ? [r._fac || r.factory, (r._lines || []).join(', ')].filter(Boolean).join('-') : ''))}" placeholder="예: 마산공장-금형2공장 열처리"></label>
    <label class="f full" for="o-pay">결제조건<input id="o-pay" value="${esc(po?.payTerms || (sup ? byId('suppliers', sup)?.payTerm || '' : ''))}" placeholder="예: 90일 어음"></label>
    <div class="full"><div class="line lh" style="margin-bottom:6px"><span>품목</span><span>수량</span><span>단가(원)</span><span style="text-align:right">금액</span><span></span></div>
      <div class="lines" id="o-lines">${lines.map(lineRow).join('')}</div>
      <div style="margin-top:8px"><button type="button" class="btn sm" data-act="addLine">+ 품목 추가</button></div>
      <div class="sum" style="margin-top:10px"><span>합계 (부가세 별도)</span><span class="mono" id="o-sum">0원</span></div>
    </div>
    <label class="f full" for="o-note">비고<textarea id="o-note">${esc(po?.note || pre?.note || '')}</textarea>${pre ? `<p class="full dim" style="margin:0;font-size:12px">선입고 ${esc(pre.no)} (${esc(pre.date)} 납품)을 발주로 전환해요. 입고 담당자가 입고한 수량이 있으면 발주 등록 때 입고로 반영돼요.</p>` : ''}</label>
    ${po?.reqNo ? `<p class="full dim" style="margin:0;font-size:12px">구매요청 ${esc(po.reqNo)}에서 자동으로 만들어진 발주대기 건입니다.${po.supplierId ? '' : ' <span class="low">요청에 거래처가 지정되지 않아 거래처를 골라야 해요.</span>'}</p>` : ''}
    ${r?.preIn ? `<p class="full" style="margin:0;font-size:12px;color:var(--warn)">선입고 ${esc(r.preNo || '')} 건이에요. ${byId('preins', r.preIn)?.received ? `입고 담당자가 ${esc(byId('preins', r.preIn).receivedDate)}에 입고한 수량이 발주 등록 때 입고로 반영돼요.` : '아직 입고 담당자가 입고하지 않았어요. 발주 등록 후 입고 담당자가 선입고 명세서 QR을 찍어 입고하면 돼요.'}${sel_unreg(r)}</p>` : ''}${r?`<p class="full dim" style="margin:0;font-size:12px">구매요청 ${esc(r.reqNo||'')}의 자재 ${lines.length}건을 발주로 전환합니다. 사용처: ${esc([r.company, r.factory, r.line].filter(Boolean).join(' · '))}</p>`:''}
  </div>`;
  const fm = modal(po ? '발주 확정' : r ? '요청을 발주로 전환' : pre ? '선입고 → 발주 전환' : '발주 등록', body, po ? `<button type="button" class="btn" data-act="close">취소</button><button type="button" class="btn" id="o-keep">대기로 저장</button><button type="submit" class="btn pri">발주 확정</button>` : `<button type="button" class="btn" data-act="close">취소</button><button type="submit" class="btn pri">발주 등록</button>`, true);
  const recalc = () => {
    let sum = 0;
    fm.querySelectorAll('.line:not(.lh)').forEach(row => {
      const q = n(row.querySelector('[data-l=qty]').value), p = n(row.querySelector('[data-l=price]').value);
      const v = amt(q, p); row.querySelector('.tot').textContent = won(v); sum += v;
    });
    $('#o-sum').textContent = won(sum);
  };
  const autofill = row => {
    const pr = row.querySelector('[data-l=price]');
    if (pr.value && !pr.dataset.auto) return;
    const lp = latestPrice(pickId(row.querySelector('[data-l=itemId]').value), $('#o-sup').value);
    pr.value = lp ? fmtIn(lp.price) : ''; pr.dataset.auto = lp ? '1' : '';
  };
  /* 거래처 검색 → 그 거래처 단가가 등록된 품목만 품목 목록에 */
  const supItemsList = () => {
    const sid = $('#o-sup').value, hint = fm.querySelector('#o-sup-hint');
    let dl = document.getElementById('dl-items-sup');
    if (!sid){ fm.querySelectorAll('[data-l=itemId]').forEach(el => el.setAttribute('list', 'dl-items')); hint.textContent = ''; return; }
    const nm = normName(supName(sid)), ids = S.items.filter(it => !it.inactive && pricesOf(it.id).some(p => !p.inactive && (p.supplierId ? p.supplierId === sid : normName(p.supplierName) === nm)));
    if (!ids.length){ fm.querySelectorAll('[data-l=itemId]').forEach(el => el.setAttribute('list', 'dl-items')); hint.textContent = '이 거래처에 등록된 품목이 없어 전체 품목에서 골라요.'; return; }
    if (!dl){ dl = document.createElement('datalist'); dl.id = 'dl-items-sup'; document.body.appendChild(dl); }
    dl.innerHTML = ids.map(it => `<option value="${esc(itemPickLabel(it))}"></option>`).join('');
    fm.querySelectorAll('[data-l=itemId]').forEach(el => el.setAttribute('list', 'dl-items-sup'));
    hint.textContent = `이 거래처에 등록된 품목 ${ids.length}개만 보여요.`;
  };
  const supQ = fm.querySelector('#o-sup-q');
  const supPick = () => { const id = ctSupId(supQ.value); if (id === $('#o-sup').value) return; $('#o-sup').value = id; supQ.classList.toggle('missing', !!supQ.value.trim() && !id); if (id){ const pt = byId('suppliers', id)?.payTerm; const pay = fm.querySelector('#o-pay'); if (pt && !pay.value) pay.value = pt; } supItemsList(); fm.querySelectorAll('.line:not(.lh)').forEach(autofill); recalc(); };
  supQ.addEventListener('input', supPick); supQ.addEventListener('change', supPick);
  fm.addEventListener('focusin', e => { if (e.target.dataset?.l === 'itemId') e.target.setAttribute('list', $('#o-sup').value && document.getElementById('dl-items-sup') && !/없어/.test(fm.querySelector('#o-sup-hint').textContent) ? 'dl-items-sup' : 'dl-items'); });
  supItemsList();
  fm.addEventListener('change', e => {
    if (e.target.id === 'o-sup') fm.querySelectorAll('.line:not(.lh)').forEach(autofill);
    if (e.target.dataset.l === 'itemId') autofill(e.target.closest('.line'));
    recalc();
  });
  fm.addEventListener('input', e => {
    if (e.target.dataset.l === 'price') delete e.target.dataset.auto;
    const row = e.target.closest('.line'), box = $('#o-lines');
    if (row && row === box.lastElementChild && [...row.querySelectorAll('input')].some(x => x.value.trim())) box.insertAdjacentHTML('beforeend', lineRow());
    recalc();
  });
  fm._recalc = recalc; recalc();
  const readLines = () => [...fm.querySelectorAll('.line:not(.lh)')].map(row => ({itemId: pickId(row.querySelector('[data-l=itemId]').value), qty: n(row.querySelector('[data-l=qty]').value), price: prc(row.querySelector('[data-l=price]').value), due: row.dataset.due || '', ...(row.dataset.ln ? {line: row.dataset.ln} : {})})).filter(l => l.itemId && l.qty > 0);
  if (po) fm.querySelector('#o-keep').onclick = async () => {
    const ls = readLines(); if (!ls.length){ toast('품목과 수량을 한 줄 이상 입력해 주세요.'); return; }
    const sid = $('#o-sup').value;
    const ok = await save(() => col('orders').doc(po.id).update({supplierId: sid, supplierName: sid ? '' : (po.supplierName || ''), factory: $('#o-fac').value, dueDate: $('#o-due').value, payTerms: $('#o-pay').value, note: $('#o-note').value, lines: ls, received: ls.map(() => 0)}));
    if (ok){ closeModal(); toast('발주대기 내용을 저장했어요.'); }
  };
  fm.onsubmit = async e => {
    e.preventDefault();
    const supplierId = $('#o-sup').value, orderDate = $('#o-date').value, dueDate = $('#o-due').value;
    const ls = [...fm.querySelectorAll('.line:not(.lh)')].map(row => ({itemId: pickId(row.querySelector('[data-l=itemId]').value), qty: n(row.querySelector('[data-l=qty]').value), price: prc(row.querySelector('[data-l=price]').value), due: row.dataset.due || '', ...(row.dataset.ln ? {line: row.dataset.ln} : {})})).filter(l => l.itemId && l.qty > 0);
    if (!supplierId || !orderDate || !dueDate){ toast(fm.querySelector('#o-sup-q').value.trim() && !supplierId ? '거래처는 목록에서 골라 주세요.' : '거래처, 발주일, 납기일을 입력해 주세요.'); return; }
    if ([...fm.querySelectorAll('.line:not(.lh) [data-l=itemId]')].some(el => el.value.trim() && !pickId(el.value))){ toast('품목은 목록에서 골라 주세요.'); return; }
    if (!ls.length){ toast('품목과 수량을 한 줄 이상 입력해 주세요.'); return; }
    const pfx = 'OM-' + orderDate.slice(2).replace(/-/g,'') + '-';
    let seq = 0; for (const x of S.orders) if ((x.poNo||'').startsWith(pfx)) seq = Math.max(seq, +x.poNo.slice(pfx.length) || 0); seq += 1;
    const poNo = pfx + String(seq).padStart(4,'0');
    let newId = null;
    const ok = await save(async () => {
      const data = {poNo, supplierId, supplierName: '', factory: $('#o-fac').value, line: r ? ((r._lines || []).length === 1 ? r._lines[0] : (r._lines || []).length ? '여러 라인' : (r.line || '')) : (po?.line || ''), orderDate, dueDate, payTerms: $('#o-pay').value, note: $('#o-note').value, dept: $('#o-dept').value.trim(), manager: $('#o-mgr').value.trim(), managerTel: $('#o-tel').value.trim(), deliveryPlace: $('#o-place').value.trim(), lines: ls.map(l => ({...l, due: l.due || dueDate})), received: ls.map(() => 0), status:'발주'};
      try { localStorage.setItem('po-last', JSON.stringify({dept: data.dept, manager: data.manager, tel: data.managerTel})); } catch(_) {}
      let ref;
      if (po){ await col('orders').doc(po.id).update({...data, confirmedAt: nowIso(), confirmedBy: uid}); ref = {id: po.id}; }
      else ref = await col('orders').add({...data, requestIds: r?[r.id]:[], createdAt: nowIso(), createdBy: uid});
      newId = ref.id;
      for (const l of ls){
        const lp = latestPrice(l.itemId, supplierId);
        if (l.price > 0 && (!lp || n(lp.price) !== l.price))
          await col('prices').add({itemId:l.itemId, supplierId, price:l.price, date:orderDate, source:'발주 '+poNo, createdAt: nowIso(), createdBy: uid});
      }
      if (pre && pre.onDone) await pre.onDone(ref.id, poNo, {...data, id: ref.id}, ls);
      if (r?.preIn){
        const px = byId('preins', r.preIn);
        const rl = reqLines(r).map(l => ({...l})); idxs.forEach((i, k) => { if (rl[i]){ rl[i].orderId = ref.id; if (!rl[i].itemId && ls[k]) rl[i].itemId = ls[k].itemId; } });
        await col('requests').doc(r.id).update({lines: rl, status: reqStatusAfter(rl), orderId: ref.id});
        if (px){ await col('preins').doc(px.id).update({status: '발주전환', orderId: ref.id, poNo, convertedAt: nowIso(), convertedBy: uid}); await preApplyToOrder(px, {...data, id: ref.id, received: []}, ls); }
      }
      else if (r){ const rl = reqLines(r).map(l => ({...l})); idxs.forEach(i => { if (rl[i]) rl[i].orderId = ref.id; }); await col('requests').doc(r.id).update({lines: rl, status: reqStatusAfter(rl), orderId: ref.id}); }
      if (po) for (const rid of (po.requestIds || [])){ const rq = byId('requests', rid); if (!rq) continue; const others = S.orders.filter(x => x.id !== po.id && (x.requestIds || []).includes(rid)); if (!others.some(isPendingPO) && reqLines(rq).every(l => !l.itemId || l.orderId)) await col('requests').doc(rid).update({status: '발주완료'}); }
    });
    if (ok){ closeModal(); tab = 'orders'; flt.ord = '발주완료'; flt.hlPo = poNo; render(); window.scrollTo(0, 0); toast(poNo + ' 발주를 등록했어요. 발주서를 확인하세요.'); setTimeout(() => { flt.hlPo = null; render(); }, 4000); const openPo = (k = 0) => byId('orders', newId) ? poPreview(newId) : k < 20 && setTimeout(() => openPo(k + 1), 150); openPo(); }
  };
}

function companyFor(fac){
  const st = S.settings.find(x => x.id === 'app') || {}, prof = st.companyProfiles || {};

  return {name: `대신금속㈜ ${fac || ''}`.trim(), ...COMPANY_DEFAULT, ...clean(prof['기본']), ...clean(prof[fac])};
}
let poLibs = null;
function loadPoLibs(){
  return poLibs ||= new Promise((res, rej) => {
    const add = src => new Promise((r, j) => { const sc = document.createElement('script'); sc.src = src; sc.onload = r; sc.onerror = j; document.head.appendChild(sc); });
    Promise.all([
      window.html2canvas ? 0 : add('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'),
      window.jspdf ? 0 : add('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'),
      window.qrcode ? 0 : add('https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js'),
    ]).then(res, e => { poLibs = null; rej(e); });
  });
}

async function docPreview(title, build, filename, okMsg){
  const fm = modal(title, `<div class="po-wrap"><div class="po-load dim">양식을 불러오는 중…</div><div id="po-doc"></div></div>`,
    `<span class="dim" style="font-size:12px">PDF로 저장한 뒤 열어서 인쇄하세요.</span><span style="flex:1"></span><button type="button" class="btn" data-act="close">닫기</button><button type="button" class="btn pri" id="po-pdf" disabled>PDF 저장</button>`, 'x');
  try { await loadPoLibs(); } catch(_) {}
  if (!document.body.contains(fm)) return;
  fm.querySelector('.po-load')?.remove();
  fm.querySelector('#po-doc').innerHTML = build();
  const btn = fm.querySelector('#po-pdf'); btn.disabled = !(window.html2canvas && window.jspdf);
  if (btn.disabled) btn.title = 'PDF 모듈을 불러오지 못했어요';
  btn.onclick = async () => {
    if (!downloads){ toast('이 화면에서는 파일 저장을 지원하지 않아요.'); return; }
    btn.disabled = true; const old = btn.textContent; btn.textContent = 'PDF 만드는 중…';
    try {
      const pdf = new window.jspdf.jsPDF({unit: 'mm', format: 'a4', orientation: 'portrait'});
      const pw = 210, ph = 297; let firstPage = true;
      for (const page of fm.querySelectorAll('.po-page')){
        const canvas = await html2canvas(page, {scale: 2, backgroundColor: '#ffffff', logging: false});
        const ih = canvas.height * pw / canvas.width, img = canvas.toDataURL('image/jpeg', 0.95);
        for (let y = 0; y < ih - 3; y += ph){ if (!firstPage) pdf.addPage(); firstPage = false; pdf.addImage(img, 'JPEG', 0, -y, pw, ih); }
      }
      await downloads.save({filename, data: pdf.output('blob')});
      toast(okMsg);
    } catch(e){ if (e?.code !== 'declined') toast('PDF를 만들지 못했어요. 잠시 후 다시 시도해 주세요.'); }
    btn.disabled = false; btn.textContent = old;
  };
}

      const k = o.id + ':' + l.i, a = amt(l.qty, ol.price), e = by.get(k) || by.set(k, {o, i: l.i, it, price: prc(ol.price), qty: 0, amt: 0}).get(k);

    (x.lines || []).forEach((l, i) => {

      if (closeMonthOf(x.date, it) !== m) return;
      const k = o.id + ':' + i, a = amt(l.qty, ol.price), e = by.get(k) || by.set(k, {o, i, it, price: prc(ol.price), qty: 0, amt: 0, pre: true}).get(k);
      e.qty += n(l.qty); e.amt += a; total += a; has = true;

/* 선택 키 → 입고 기록: 「행키」는 그 품목 전체, 「행키|구분|단가」는 그 구분(양품/소재불량/가공불량)만 */

function recvRows(){
  const out = [];
  const movesBy = new Map(); for (const m of S.moves) if (m.type === 'in' && m.orderId){ const k = m.orderId; (movesBy.get(k) || movesBy.set(k, []).get(k)).push(m); }
  for (const o of S.orders){
    if (!['발주','부분입고','입고완료'].includes(o.status)) continue;
    const rq = (o.requestIds || []).map(id => byId('requests', id)).find(Boolean);
    const mv = movesBy.get(o.id) || [];
    (o.lines || []).forEach((l, i) => {
      const it = item(l.itemId) || {}, rc = n((o.received || [])[i]), rem = Math.max(0, n(l.qty) - rc);
      const lm = mv.filter(m => m.lineIdx != null ? m.lineIdx === i : m.itemId === l.itemId);
      const lastDate = lm.map(m => m.date).sort().pop() || '';
      out.push({o, l, i, it, rc, rem, key: o.id + ':' + i, due: l.due || o.dueDate || '', lastDate, moves: lm,
        company: o.company || rq?.company || '대신금속', line: l.line || (o.line !== '여러 라인' ? o.line : '') || lnLine(reqLines(rq || {}).find(x => x.orderId === o.id && x.itemId === l.itemId), rq) || '', requester: rq?.manager || '',
        amt: amt(l.qty, l.price), ramt: lm.some(m => m.defect || m.amt != null) ? lm.reduce((a, m) => a + mvAmt(m, l.price), 0) : amt(rc, l.price)});
    });
  }
  return out.sort((a, b) => (b.o.orderDate || '').localeCompare(a.o.orderDate || '') || (b.o.poNo || '').localeCompare(a.o.poNo || '') || a.i - b.i);
}
function recvFilter(all){

  const me = ($('#who').textContent || '').replace(/ 님$/, '');
  return all.filter(x => {
    if (Q.status === '미입고' && x.rc > 0) return false;
    if (Q.status === '부분입고' && !(x.rc > 0 && x.rem > 0)) return false;
    if (Q.status === '입고완료' && x.rem > 0) return false;
    const d = Q.basis === '납기일' ? x.due : Q.basis === '입고일' ? x.lastDate : x.o.orderDate;
    if ((Q.from || Q.to) && !d) return false;
    if (Q.from && d < Q.from) return false;
    if (Q.to && d > Q.to) return false;
    if (flt.rMine && x.o.manager !== me && x.o.createdBy !== uid) return false;
    return has(x.o.poNo, F.poNo) && has(orderSup(x.o), F.sup) && has(x.o.manager, F.mgr) && has(x.requester, F.req) && has(x.it.code, F.code) && has(x.it.name, F.name) && has(x.it.spec, F.spec)
      && (!F.acct || x.it.account === F.acct) && (!F.sub || x.it.subAccount === F.sub) && (!F.fac || x.o.factory === F.fac) && (!F.line || x.line === F.line);
  });
}

    const ok = await save(async () => {

  };
}

/* ---------- 외주(P_) 불량 정산 ----------
   입고 수량 = 양품 + 소재불량 + 가공불량 (모두 입고로 잡힘)
   · 소재불량: 단가 = 발주단가(가공단가) × 계약서 소재불량 %
   · 가공불량: 단가 = −(품목 소재단가 × 계약서 가공불량 %)  → 업체 대금에서 차감
   비율은 거래처의 유효한 기본거래계약서(계약서 탭) 「불량정산」에서 가져옴 */
const isOuts = it => /^P_/i.test(it?.code || '');
function ctDefectFor(supId, date){
  date = date || today();
  const cs = S.contracts.filter(c => c.supplierId === supId && (c.kind || '외주') === '외주' && c.docType === '기본거래계약서' && !c.terminated
    && (!c.startDate || c.startDate <= date) && (!c.endDate || ctRenewY(c) || c.endDate >= date)
    && c.defect && (c.defect.mat !== '' && c.defect.mat != null || c.defect.proc !== '' && c.defect.proc != null))
    .sort((a, b) => (b.startDate || '').localeCompare(a.startDate || ''));
  const c = cs[0]; if (!c) return null;
  const v = x => x === '' || x == null ? null : n(x);
  return {mat: v(c.defect.mat), proc: v(c.defect.proc), no: c.no || '', id: c.id};
}
/* 한 품목 입고를 양품/소재불량/가공불량 입고 기록으로 나눔 */
function defSplit(o, i, q, dm, dp, date){
  const L = o.lines[i], it = item(L.itemId) || {}, price = n(L.price);
  dm = isOuts(it) ? Math.max(0, n(dm)) : 0; dp = isOuts(it) ? Math.max(0, n(dp)) : 0;
  const out = [], good = n(q) - dm - dp;
  if (good > 0) out.push({qty: good, price});
  if (!(dm > 0 || dp > 0)) return out;
  const r = ctDefectFor(o.supplierId, date), mp = n(it.matPrice);
  if (dm > 0){ const ok = r && r.mat != null; out.push({qty: dm, price: ok ? Math.round(price * r.mat / 100) : price, defect: '소재불량', defRate: ok ? r.mat : null, basePrice: price, ctNo: r?.no || '', defWarn: ok ? '' : '계약서 소재불량 비율 없음 (발주단가 적용)'}); }
  if (dp > 0){ const ok = r && r.proc != null && mp > 0; out.push({qty: dp, price: ok ? -Math.round(mp * r.proc / 100) : 0, defect: '가공불량', defRate: r?.proc ?? null, matPrice: mp || null, basePrice: price, ctNo: r?.no || '', defWarn: ok ? '' : !(r && r.proc != null) ? '계약서 가공불량 비율 없음 (0원 처리)' : '품목 소재단가 미등록 (0원 처리)'}); }
  return out;
}
const defBad = (q, d) => n(d.dm) < 0 || n(d.dp) < 0 || n(d.dm) + n(d.dp) > n(q) + 1e-9;
const defCells = (it, key, on) => !on ? '' : isOuts(it) ? `<td><input class="def-c" inputmode="decimal" data-dk="${esc(key)}" data-dt="m" placeholder="0" aria-label="소재불량"></td><td><input class="def-c" inputmode="decimal" data-dk="${esc(key)}" data-dt="p" placeholder="0" aria-label="가공불량"></td>` : '<td></td><td></td>';
const defHeads = on => on ? '<th class="num">소재불량</th><th class="num">가공불량</th>' : '';
/* 입고 화면용: 불량 입력칸 (외주 품목만) */
const defInputs = (it, key, attr = 'data-dk', vals = {}) => isOuts(it) ? `<div class="def-in"><label>소재불량<input inputmode="decimal" ${attr}="${esc(key)}" data-dt="m" value="${esc(vals.m ?? '')}" placeholder="0"></label><label>가공불량<input inputmode="decimal" ${attr}="${esc(key)}" data-dt="p" value="${esc(vals.p ?? '')}" placeholder="0"></label></div>` : '';
const defRead = (root, key, attr = 'data-dk') => ({dm: n(root.querySelector(`[${attr}="${CSS.escape(key)}"][data-dt="m"]`)?.value), dp: n(root.querySelector(`[${attr}="${CSS.escape(key)}"][data-dt="p"]`)?.value)});
function defHint(o, it){
  if (!isOuts(it)) return '';
  if (staffAcct) return '';  /* 입고 담당자에게는 단가·비율 안내 없음 */
  const r = ctDefectFor(o.supplierId);
  if (!r) return '';
  return `<div class="def-hint">${r ? `불량정산 (${esc(r.no)}): 소재불량 가공단가×<b>${r.mat ?? '–'}%</b> · 가공불량 소재단가×<b>${r.proc ?? '–'}%</b>${n(it.matPrice) ? ` <span class="dim">(소재단가 ${fmt(it.matPrice)})</span>` : ' <span class="low">소재단가 미등록</span>'}` : '<span class="low">이 거래처의 기본거래계약서 불량정산 비율이 없어요</span>'}</div>`;
}
/* 입고 기록을 양품/소재불량/가공불량별로 묶음 (불량이 있을 때만) */
function defParts(moves, linePrice){
  if (!(moves || []).some(m => m.defect)) return [];
  const by = new Map();
  for (const m of moves){ const k = m.defect || '양품', pr = m.price ?? linePrice, key = k + '|' + n(pr); const g = by.get(key) || by.set(key, {kind: k, price: n(pr), key, qty: 0, amt: 0, rate: m.defRate, mvs: []}).get(key); g.qty += n(m.qty); g.amt += amt(m.qty, pr); g.mvs.push(m); }
  for (const g of by.values()){ g.closed = g.mvs.every(m => m.closed); g.sent = g.closed && g.mvs.every(m => m.sent); g.cd = g.closed ? (g.mvs.map(m => m.closeDate).filter(Boolean).sort().pop() || '') : ''; }
  const ord = {'양품': 0, '소재불량': 1, '가공불량': 2};
  return [...by.values()].sort((a, b) => ord[a.kind] - ord[b.kind]);
}
const defKindPill = (k, rate) => k === '양품' ? '<span class="pill p-ok">양품</span>' : `<span class="pill ${k === '가공불량' ? 'p-bad' : 'p-wait'}">${k}</span>${rate != null ? ` <span class="dim">${fmt(rate)}%</span>` : ''}`;
/* 입고 기록의 불량 표시 */
const defBadge = moves => { const t = {}; for (const m of moves || []) if (m.defect) t[m.defect] = (t[m.defect] || 0) + n(m.qty); return Object.keys(t).length ? `<div class="def-b">${Object.entries(t).map(([k, v]) => `<span class="pill ${k === '가공불량' ? 'p-bad' : 'p-wait'}">${k} ${fmt(v)}</span>`).join(' ')}</div>` : ''; };

async function doReceive(o, qs, date, note){
  const received = (o.lines||[]).map((_,i) => n((o.received||[])[i]));
  const ids = [];
  for (const x of qs){
    received[x.i] += x.q;
    for (const part of defSplit(o, x.i, x.q, x.dm, x.dp, date)){
      const ref = await col('moves').add({type:'in', itemId: o.lines[x.i].itemId, lineIdx: x.i, ...part, date, orderId: o.id, note: note || '', createdAt: nowIso(), createdBy: uid}); if (ref?.id) ids.push(ref.id);
    }
  }
  const done = o.lines.every((l,i) => received[i] >= n(l.qty));
  await col('orders').doc(o.id).update({received, status: done ? '입고완료' : '부분입고', lastReceivedAt: date});
  return ids;
}
async function receiveLines(keys){
  const date = $('#rcv-date')?.value || today(), note = $('#rcv-note')?.value.trim() || '';
  if (!date){ toast('입고일을 입력해 주세요.'); return; }
  if (isClosed(date)){ toast(`${date.slice(0,7)}월은 마감이 확정됐어요. 입고일을 바꿔 주세요.`); return; }
  const by = new Map(); let bad = 0;
  for (const k of keys){
    const [oid, si] = k.split(':'), i = +si, o = byId('orders', oid); if (!o) continue;
    const rem = Math.max(0, n(o.lines[i]?.qty) - n((o.received||[])[i]));
    const q = n(flt.rqty?.[k] ?? rem), dd = flt.rqd?.[k] || {}, d = {dm: n(dd.m), dp: n(dd.p)};
    if (!(q > 0) || q > rem || defBad(q, d)){ bad++; continue; }
    (by.get(oid) || by.set(oid, {o, qs: []}).get(oid)).qs.push({i, q, ...d});
  }
  if (bad){ toast('입고 수량은 0보다 크고 잔량 이하로, 불량 수량은 입고 수량 이하로 입력해 주세요.'); return; }
  if (!by.size){ toast('입고할 항목을 골라 주세요.'); return; }
  const ok = await save(async () => { for (const {o, qs} of by.values()) await doReceive(o, qs, date, note); });
  if (ok){ const cnt = [...by.values()].reduce((a, x) => a + x.qs.length, 0); flt.rEdit = false; for (const k of keys){ flt.rsel?.delete(k); if (flt.rqty) delete flt.rqty[k]; if (flt.rqd) delete flt.rqd[k]; } render(); toast(`${cnt}개 항목을 ${date} 입고 처리했어요.`); }
}

  const body = `<div class="mb">

async function pwHash(pw, salt){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pw));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
const newSalt = () => [...crypto.getRandomValues(new Uint8Array(12))].map(b => b.toString(16).padStart(2, '0')).join('');

const genPw = () => { const c = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789'; return [...crypto.getRandomValues(new Uint8Array(10))].map(b => c[b % c.length]).join(''); };

function scmAutoLogin(){

async function scmLogin(){
  const id = ($('#scm-id')?.value || '').trim().toLowerCase(), pw = $('#scm-pw')?.value || '';
  const msg = t => { const m = $('#scm-msg'); if (m){ m.textContent = t; m.hidden = !t; } };
  if (!id || !pw){ msg('아이디와 비밀번호를 입력해 주세요.'); return; }
  const a = allAccts().find(x => x.loginId === id);
  if (!a || a.hash !== await pwHash(pw, a.salt)){ msg('아이디 또는 비밀번호가 맞지 않아요.'); return; }
  if (a.active === false){ msg('사용이 중지된 계정이에요. 대신금속 구매팀에 문의해 주세요.'); return; }
  scmSession.set(a.id);
  if (db && uid){ try { await col('scm').doc(a.id).update({boundUsers: [...new Set([...(a.boundUsers || []), uid])], lastLogin: nowIso()}); } catch(_) {} }
  scmEnter(a);
}

}

/* 거래명세서 단위 입고 취소: 입고 기록 삭제 + 발주 입고수량 되돌림 + 출하 상태 「출하등록」으로 */

/* ---------- 입고 담당자 화면 ---------- */
function findStmt(text){
  const t = String(text || '').trim(); if (!t) return null;
  const m = /^DSSCM:([^:]+):?(.*)$/i.exec(t);
  if (m) return S.ships.find(x => x.batchId === m[1] || x.id === m[1]) || (m[2] && S.ships.find(x => x.stmtNo === m[2])) || null;
  const u = t.toUpperCase(), tm = /TS\d{6}-\d{3,}/.exec(u);
  if (tm){ const hit = S.ships.find(x => (x.stmtNo || '').toUpperCase() === tm[0]); if (hit) return hit; }
  return S.ships.find(x => x.id === t) || S.ships.find(x => (x.stmtNo || '').toUpperCase() === u) || S.ships.find(x => (x.inv || '').toUpperCase() === u) || null;
}
function handleScan(text){
  const pm = /PI\d{6}-\d{3,}/.exec(String(text || '').toUpperCase()); const px = pm && S.preins.find(x => x.no === pm[0]);
  if (px){ preRecv(px.id); return; }
  const sh = findStmt(text);
  if (!sh){ toast('해당하는 거래명세서를 찾지 못했어요. 번호를 확인해 주세요.'); return; }
  if (sh.status === '반려'){ toast('반려된 출하예요. 구매팀에 확인해 주세요.'); return; }
  if (!shipBatch(sh).some(x => x.status === '출하등록')){ toast(`${sh.stmtNo || '이 거래명세서'}는 이미 ${sh.receivedDate || ''} 입고 처리됐어요.`); return; }
  shipRecv(sh.id);
}
let jsqrLib = null;
const loadJsQR = () => jsqrLib ||= new Promise((res, rej) => { if (window.jsQR) return res(); const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js'; sc.onload = res; sc.onerror = e => { jsqrLib = null; rej(e); }; document.head.appendChild(sc); });
function decodeCanvas(cv){ const ctx = cv.getContext('2d'); const img = ctx.getImageData(0, 0, cv.width, cv.height); const r = window.jsQR(img.data, cv.width, cv.height, {inversionAttempts: 'attemptBoth'}); return r?.data || ''; }
async function scanPhoto(file){
  try { await loadJsQR(); } catch(_) { toast('QR 인식 모듈을 불러오지 못했어요. 번호를 직접 입력해 주세요.'); return; }
  try {
    const bmp = await createImageBitmap(file); const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
    let txt = decodeCanvas(cv);
    /* 한 장에 QR이 두 개(보관용 2부) 찍힌 경우: 위·아래·왼쪽 부분만 잘라 다시 시도 */
    for (const [x, y, w, h] of [[0, 0, 1, .5], [0, .5, 1, .5], [0, 0, .5, .5], [0, .5, .5, .5]]){
      if (txt) break;
      const c2 = document.createElement('canvas'); c2.width = Math.round(cv.width * w); c2.height = Math.round(cv.height * h);
      c2.getContext('2d').drawImage(cv, cv.width * x, cv.height * y, c2.width, c2.height, 0, 0, c2.width, c2.height);
      txt = decodeCanvas(c2);
    }
    if (!txt){ toast('사진에서 QR을 찾지 못했어요. QR이 크게 나오도록 다시 찍어 주세요.'); return; }
    handleScan(txt);
  } catch(_) { toast('사진을 읽지 못했어요. 다시 시도해 주세요.'); }
}

    if (!mach){ set(r, cT, nz(prSum(x.a)), st); set(r, cT + 1, nz(prH1(x.a)), st); set(r, cT + 2, nz(prH2(x.a)), st); }
    set(r, cN, x.type === 'sub' || x.type === 'total' ? `${mach && x.type === 'sub' ? `※ 전월대비 ${x.note} 구매현황\n` : ''}${prDiffText(x.a, mi)}` : '', 'note');
    r++;
  }
  set(first, 1, sc[2], 'lab'); merge(first, 1, r - 1, 1, 'lab');
  const ws = {};
  for (const [k, {v, st}] of Object.entries(cells)){

  ws['!ref'] = XLSX.utils.encode_range({s: {r: 0, c: 0}, e: {r: r, c: NC - 1}});
  ws['!merges'] = merges;

}

    ...det.map(x => { const L = lbl(x.sc, x.k); return [`${+x.m.slice(5)}월 실적`, orderSup(x.o), '대신금속', SCN[x.sc][0], x.o.factory || '', x.line, x.it.account || '', x.it.subAccount || '', L[0], L[1], x.it.code || '', x.it.name || '', x.it.spec || '', x.qty, x.it.unit || '', prc(x.price), x.amt, x.date, x.cd, x.o.poNo || '']; })];
  const has = k => { const parts = PR_PARTS[k] || [k], P = prPlanDoc(y)?.data || {}; return parts.some(p => Object.keys(prActual(y).A[p] || {}).length || P[p]); };
  const list = PR_SCOPES.filter(([k]) => G.ks.includes(k)).filter(([k]) => k === 'ETCF' ? prHasEtc(y) : k === 'GA:마산6공장' ? has(k) : true);

  ]);
}

document.addEventListener('input', e => {
  const el = e.target; if (!el.classList?.contains('nf') || e.isComposing) return;
  const v = el.value, pos = el.selectionStart ?? v.length, digitsBefore = v.slice(0, pos).replace(/[^0-9.\-]/g, '').length;
  const clean = v.replace(/[^0-9.\-]/g, ''), out = fmtIn(clean);
  if (out === v) return;
  el.value = out;
  let k = 0, p = 0; while (p < out.length && k < digitsBefore){ if (/[0-9.\-]/.test(out[p])) k++; p++; }
  try { el.setSelectionRange(p, p); } catch(_) {}
}, true);
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset?.gsel != null){ flt.ssel ||= new Set(); t.checked ? flt.ssel.add(t.dataset.gsel) : flt.ssel.delete(t.dataset.gsel); render(); return; }
  if (t.dataset && 'gall' in t.dataset){ flt.ssel ||= new Set(); document.querySelectorAll('[data-gsel]').forEach(c => t.checked ? flt.ssel.add(c.dataset.gsel) : flt.ssel.delete(c.dataset.gsel)); render(); return; }
  if (t.dataset?.ssel){ t.checked ? SCM.sel.add(t.dataset.ssel) : SCM.sel.delete(t.dataset.ssel); render(); return; }
  if (t.dataset && 'sall' in t.dataset){ document.querySelectorAll('[data-ssel]').forEach(c => t.checked ? SCM.sel.add(c.dataset.ssel) : SCM.sel.delete(c.dataset.ssel)); render(); return; }
  if (t.id === 'scan-photo' && t.files?.[0]){ scanPhoto(t.files[0]); t.value = ''; return; }
  if (t.id === 'scm-month' && t.value){ SCM.month = t.value; render(); return; }
  if (t.id === 'sh-date'){ SCM.shipDate = t.value; return; }
  if (['pi-date','pi-fac'].includes(t.id) || t.dataset?.pi != null){ preReadForm(); if (t.dataset?.pi != null) render(); return; }
  if (t.id === 'close-month' && t.value){ flt.month = t.value; render(); return; }
  if ((t.id === 'sh-from' || t.id === 'sh-to') && t.value){ SCM[t.id === 'sh-from' ? 'shFrom' : 'shTo'] = t.value; render(); return; }
  if (t.id === 'sh-month' && t.value){ SCM.shFrom = t.value + '-01'; SCM.shTo = monthEnd(t.value); render(); return; }
  if ((t.id === 'ord-from' || t.id === 'ord-to') && t.value){ flt[t.id === 'ord-from' ? 'ordFrom' : 'ordTo'] = t.value; render(); return; }
  if (t.id === 'done-month' && t.value){ flt.doneMonth = t.value; flt.dsel = new Set(); render(); return; }
  if (t.dataset?.dsel){ flt.dsel ||= new Set(); t.checked ? flt.dsel.add(t.dataset.dsel) : flt.dsel.delete(t.dataset.dsel); render(); return; }
  if (t.dataset && 'dall' in t.dataset){ flt.dsel ||= new Set(); const bx = [...document.querySelectorAll('[data-dsel]')];
    if (!t.checked) bx.forEach(c => flt.dsel.delete(c.dataset.dsel));
    else { /* 전체 선택: 이미 고른 쪽이 있으면 그쪽만, 없으면 미마감 우선 (없으면 마감된 것) */
      const cur = bx.filter(c => c.checked && !c.disabled).map(c => c.dataset.dst).find(x => x !== 'mix');
      const want = cur || (bx.some(c => c.dataset.dst === 'open') ? 'open' : 'closed');
      bx.filter(c => c.dataset.dst === want).forEach(c => flt.dsel.add(c.dataset.dsel)); }
    render(); return; }
  if (t.dataset?.rsel){ flt.rsel = flt.rsel || new Set(); t.checked ? flt.rsel.add(t.dataset.rsel) : flt.rsel.delete(t.dataset.rsel); render(); return; }
  if (t.dataset && 'rall' in t.dataset){ flt.rsel = flt.rsel || new Set(); document.querySelectorAll('[data-rsel]').forEach(c => t.checked ? flt.rsel.add(c.dataset.rsel) : flt.rsel.delete(c.dataset.rsel)); render(); return; }
  if (t.id === 'rcv-date'){ flt.rdate = t.value; return; }
  if (['rq-status','rq-basis','rq-from','rq-to'].includes(t.id)){ const g = id => $('#' + id)?.value; flt.rq = {status: g('rq-status'), basis: g('rq-basis'), from: g('rq-from'), to: g('rq-to')}; render(); return; }
  if (t.dataset?.rf && t.tagName === 'SELECT'){ (flt.rf ||= {})[t.dataset.rf] = t.value; render(); return; }
  if (t.id === 'pay-file' && t.files?.[0]){ importPreview(t.files[0]); return; }
  if (t.id === 'pr-file' && t.files?.[0]){ prImportFile(t.files[0]); t.value = ''; return; }
  if (t.dataset?.chk != null) save(() => saveClosing(flt.month, {checks: {[t.dataset.chk]: t.checked}}));
  if (t.dataset?.memo != null) save(() => saveClosing(flt.month, {memos: {[t.dataset.memo]: t.value}}));
  if (t.dataset?.vat != null){ const [sid, f] = t.dataset.vat.split('|'), v = String(t.value).replace(/,/g, '').trim(); save(() => saveClosing(flt.month, {vatOv: {[sid]: {[f]: v === '' ? 0 : n(v)}}})); }
  if (t.dataset?.paynote != null) save(() => saveClosing(flt.month, {payNotes: {[t.dataset.paynote]: t.value}}));
});

/* ---------- boot ---------- */
async function init(){
  render();
  if (typeof window.claude?.use !== 'function'){ showBanner('이 페이지는 claude.ai에서 열어야 팀 데이터가 저장돼요.'); return; }
  try { db = await claude.use('db'); } catch(_) { db = null; }
  try { user = await claude.use('user'); } catch(_) { user = null; }
  claude.use('downloads').then(d => { downloads = d; }).catch(() => {});
  claude.use('sample').then(f => { sampleFn = f; }).catch(() => {});
  claude.use('assets').then(a => { assetsApi = a; }).catch(() => {});
  if (!db){ booting = false; showBanner('데이터 저장소에 연결할 수 없어요. claude.ai에 로그인한 상태로 열어 주세요.'); render(); return; }
  if (user){
    uid = await user.id();
    const me = await user.me();
    if (me.name){ myName = me.name; $('#who').textContent = me.name + ' 님'; }
    /* 외부(게스트)로 초대된 사람은 SCM 로그인 화면만 */
    if (uid){ try { const ps = await user.profiles([uid]); scmGate = !!ps[uid]?.guest; } catch(_) {} }
    const can = await user.can('data.write');
    if (can === false){ readOnly = true; showBanner('보기 전용 권한이에요. 요청·발주를 등록하려면 공유한 사람에게 "참여자(Contributor)" 이상 권한을 요청해 주세요.'); }
  }
  booting = false;
  for (const c of COLS){
    db.collection(c).onSnapshot(s => {
      const docs = s.docs.map(d => ({id: d.id, ...d.data()}));
      if (c === 'items') legacyItems = docs; else S[c] = docs;
      if (c === 'items' || c === 'itemsets') buildItems();
      if (c === 'itemsets') loaded.items = true; else if (c !== 'items') loaded[c] = true;
      if (c === 'scm'){ if (scmAcct){ const a = docs.find(x => x.id === scmAcct.id); if (!a || a.active === false || (!scmPreview && uid && !(a.boundUsers || []).includes(uid) && scmSession.get() !== a.id)){ scmSup = null; staffAcct = null; scmAcct = null; scmPreview = false; } else { scmAcct = a; if (staffAcct) staffAcct = a; } } scmAutoLogin(); }
      dataVer++; render();
    }, () => showBanner('데이터 연결이 끊겼어요. 페이지를 새로 열어 주세요.'));
  }
}
function showBanner(t){ const b = $('#banner'); b.textContent = t; b.hidden = false; }
init();
})();
</script>
